server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS — resolves service names at request time, not startup
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Auth endpoints - proxy to gateway (without /api prefix since gateway strips it)
    location /auth/ {
        set $gateway_upstream http://gateway:8080;
        rewrite ^(/auth/.*)$ /api$1 break;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $http_origin always;
    }

    # Workflow service direct proxy — gateway has no StripPrefix for /workflows/**
    location /api/workflows {
        set $workflow_upstream http://workflow-service:8085;
        proxy_pass $workflow_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $http_origin always;
    }

    location /api/workflow-schemes {
        set $workflow_upstream http://workflow-service:8085;
        proxy_pass $workflow_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $http_origin always;
    }

    location /api/workflow/ {
        set $workflow_upstream http://workflow-service:8085;
        proxy_pass $workflow_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $http_origin always;
    }

    # Epic service — gateway has no /api/epics/** route; proxy directly to issue-service
    location /api/epics {
        set $issue_upstream http://issue-service:8084;
        proxy_pass $issue_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $http_origin always;
    }

    # API routes - proxy to gateway directly
    location /api/ {
        set $gateway_upstream http://gateway:8080;
        rewrite ^/api/(.*)$ /api/$1 break;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $http_origin always;
    }

    # WebSocket with proper upgrade headers
    location /ws/ {
        set $gateway_upstream http://gateway:8080;
        rewrite ^/ws/(.*)$ /ws/$1 break;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $http_origin always;
    }

    # User-service CWD admin API — frontend calls /user-service/rest/admin/1.0/*
    location /user-service/ {
        set $gateway_upstream http://gateway:8080;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $http_origin always;
    }

    # Fields service — proxy /fields/* directly to migration-service (not in gateway docker config)
    # /fields/X → jira-migration-service:8094/api/fields/X
    # Inject a default X-User-Id when the browser hasn't set one (system/admin actor UUID)
    # Use rewrite+variable so nginx resolves the hostname at request time (not startup)
    location /fields/ {
        set $migration_upstream http://migration-service:8094;
        rewrite ^/fields/(.*)$ /api/fields/$1 break;
        proxy_pass $migration_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-User-Id "00000000-0000-0000-0000-000000000001";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $http_origin always;
    }

    # Proxy backend service paths (non-/api/ gateway routes) to gateway
    # These must come before the SPA catch-all so API calls get proxied, not served as HTML
    location ~ ^/(users|components|versions|sprints|boards|workflows|audit|comments|notifications|search|attachments|plans|programs|migration)/ {
        set $gateway_upstream http://gateway:8080;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $http_origin always;
    }

    # Serve static files (React app) - CATCH ALL for SPA
    # This handles /issues, /boards, /dashboard, /projects, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
