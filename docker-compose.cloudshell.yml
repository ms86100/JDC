services:
  postgres:
    image: postgres:16-alpine
    container_name: avionics-systems-postgres
    environment:
      POSTGRES_USER: avionicsadmin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-avionicspass}
      POSTGRES_DB: avionics_systems_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avionicsadmin -d avionics_systems_platform"]
      interval: 10s
      timeout: 5s
      retries: 10

  gateway:
    image: ghcr.io/ms86100/avionics-systems-gateway:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: cloudshell
      REDIS_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    image: ghcr.io/ms86100/avionics-systems-auth-service:latest
    environment:
      SPRING_PROFILES_ACTIVE: cloudshell
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: avionics_systems_platform
      DB_USERNAME: avionicsadmin
      DB_PASSWORD: ${DB_PASSWORD:-avionicspass}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  project-service:
    image: ghcr.io/ms86100/avionics-systems-project-service:latest
    environment:
      SPRING_PROFILES_ACTIVE: cloudshell
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: avionics_systems_platform
      DB_USERNAME: avionicsadmin
      DB_PASSWORD: ${DB_PASSWORD:-avionicspass}
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  issue-service:
    image: ghcr.io/ms86100/avionics-systems-issue-service:latest
    environment:
      SPRING_PROFILES_ACTIVE: cloudshell
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: avionics_systems_platform
      DB_USERNAME: avionicsadmin
      DB_PASSWORD: ${DB_PASSWORD:-avionicspass}
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  migration-service:
    image: ghcr.io/ms86100/avionics-systems-migration-service:latest
    environment:
      SPRING_PROFILES_ACTIVE: cloudshell
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: avionics_systems_platform
      DB_USERNAME: avionicsadmin
      DB_PASSWORD: ${DB_PASSWORD:-avionicspass}
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8094/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  dashboard-service:
    image: ghcr.io/ms86100/avionics-systems-dashboard-service:latest
    environment:
      SPRING_PROFILES_ACTIVE: cloudshell
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: avionics_systems_platform
      DB_USERNAME: avionicsadmin
      DB_PASSWORD: ${DB_PASSWORD:-avionicspass}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8095/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  audit-service:
    image: ghcr.io/ms86100/avionics-systems-audit-service:latest
    environment:
      SPRING_PROFILES_ACTIVE: cloudshell
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: avionics_systems_platform
      DB_USERNAME: avionicsadmin
      DB_PASSWORD: ${DB_PASSWORD:-avionicspass}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8089/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  plan-service:
    image: ghcr.io/ms86100/avionics-systems-plan-service:latest
    environment:
      SPRING_PROFILES_ACTIVE: cloudshell
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: avionics_systems_platform
      DB_USERNAME: avionicsadmin
      DB_PASSWORD: ${DB_PASSWORD:-avionicspass}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8092/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    image: ghcr.io/ms86100/avionics-systems-frontend:latest
    ports:
      - "3000:80"
    environment:
      VITE_API_GATEWAY_URL: http://gateway:8080
      VITE_ENV: cloudshell
    depends_on:
      - gateway

volumes:
  postgres_data:
