# =============================================================================
# Docker Compose Override for Google Cloud Shell
# Usage: docker-compose -f docker-compose.yml -f docker-compose.cloudshell.yml up -d
# =============================================================================

services:
  gateway:
    image: ghcr.io/ms86100/jira-gateway:latest
    environment:
      SPRING_PROFILES_ACTIVE: cloudshell
      REDIS_ENABLED: "false"
    ports:
      - "8080:8080"

  auth-service:
    image: ghcr.io/ms86100/jira-auth-service:latest
    environment:
      SPRING_PROFILES_ACTIVE: cloudshell
      DB_HOST: postgres
      DB_PORT: 5432

  project-service:
    image: ghcr.io/ms86100/jira-project-service:latest
    environment:
      SPRING_PROFILES_ACTIVE: cloudshell
      DB_HOST: postgres
      DB_PORT: 5432

  frontend:
    environment:
      VITE_API_GATEWAY_URL: http://localhost:8080
      VITE_ENV: cloudshell
    ports:
      - "3000:3000"

  redis:
    profiles:
      - disabled
