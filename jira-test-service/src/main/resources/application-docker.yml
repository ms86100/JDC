server:
  port: 8095

spring:
  application:
    name: jira-test-service
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:jira_platform}
    username: ${DB_USERNAME:jiraadmin}
    password: ${DB_PASSWORD:jirapass123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: jira_test
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    default-schema: jira_test
    schemas: jira_test
    create-schemas: true
    validate-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    com.jira: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
  file:
    path: ${LOG_PATH:../../logs}/test

issue:
  service:
    url: http://issue-service:8084

project:
  service:
    url: http://project-service:8083

test:
  storage:
    type: LOCAL
    path: /var/test-evidence

# Service URLs for inter-service communication
services:
  issueServiceUrl: ${ISSUE_SERVICE_URL:http://issue-service:8084}
  projectServiceUrl: ${PROJECT_SERVICE_URL:http://project-service:8083}