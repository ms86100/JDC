# Docker Compose override for external PostgreSQL (in0-eplmdb-v01)
# Usage: docker-compose -f docker-compose.yml -f docker-compose.external.yml up -d
#
# This override:
#   1. Disables the local postgres container
#   2. Points all services to the external PostgreSQL server
#   3. Removes postgres health-check dependencies

services:
  postgres:
    profiles:
      - disabled
    deploy:
      replicas: 0

  auth-service:
    environment:
      DB_HOST: in0-eplmdb-v01
      DB_PORT: 5432
      DB_NAME: systems
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on: !override []

  user-service:
    environment:
      DB_HOST: in0-eplmdb-v01
      DB_PORT: 5432
      DB_NAME: systems
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      auth-service:
        condition: service_healthy

  project-service:
    environment:
      DB_HOST: in0-eplmdb-v01
      DB_PORT: 5432
      DB_NAME: systems
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      auth-service:
        condition: service_healthy

  issue-service:
