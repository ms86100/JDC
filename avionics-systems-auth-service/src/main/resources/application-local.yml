spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/avionics_systems_platform
    username: avionicsadmin
    password: ${DB_PASSWORD:localpass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8081

jwt:
  secret: avionics-systems-platform-super-secret-key-that-is-at-least-256-bits-long
  expiration-ms: 86400000
  refresh-expiration-ms: 604800000

logging:
  level:
    com.avionics_systems.auth: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
