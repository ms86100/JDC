server:
  port: 8090

spring:
  application:
    name: jira-attachment-service
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jira_platform}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: jira_attachment

  flyway:
    enabled: false

# Cluster storage configuration (StorageProvider from jira-cluster-commons)
cluster:
  storage:
    type: ${STORAGE_TYPE:LOCAL}
    base-path: ${ATTACHMENT_STORAGE_PATH:/var/jira/attachments}
    s3:
      endpoint: ${MINIO_ENDPOINT:http://minio:9000}
      bucket: ${MINIO_BUCKET:jira-attachments}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      region: ${MINIO_REGION:us-east-1}
      path-style-access: true

jira:
  attachment:
    allowed-types:
      - image/png
      - image/jpeg
      - image/gif
      - image/webp
      - application/pdf
      - text/plain
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.ms-excel
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - application/zip
      - application/x-zip-compressed

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

cdn:
  base-url: ${CDN_BASE_URL:}

logging:
  file:
    path: ${LOG_PATH:../../logs}/attachment
