server:
  port: 8080

spring:
  application:
    name: avionics-systems-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}"
            allowedMethods: "*"
            allowedHeaders: "*"
            maxAge: 3600

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
    group: 'all'
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  show-actuator: true

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,caches
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
    redis:
      enabled: false
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: 3600000
  refresh-expiration-ms: 604800000

# Rate Limiting Configuration
ratelimit:
  requests-per-minute: 100
  requests-per-hour: 1000
  requests-per-day: 10000
  burst-capacity: 50

# Cache Configuration
cache:
  caffeine:
    initial-capacity: 100
    maximum-size: 500
    expire-after-write-minutes: 10
    expire-after-access-minutes: 5

# Logging Configuration
logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    com.avionics_systems.gateway: DEBUG
  file:
    path: ${LOG_PATH:../../logs}/gateway

# Application Configuration
app:
  gateway:
    public-paths: /api/auth/login,/api/auth/register,/api/auth/refresh,/v3/api-docs/**,/swagger-ui/**,/swagger-resources/**,/actuator/health,/ws/**
    headers:
      user-id: X-User-Id
      username: X-Username
      user-roles: X-User-Roles
    rate-limit:
      exempt-paths: /actuator/health,/actuator/health/**,/api/benchmark/**
      header-limit: "100"
      retry-after-seconds: "60"
    service-name: avionics-systems-gateway
    redis-key-prefix: "ratelimit:"
    cors:
      allowed-origins: "*"
  openapi:
    title: Avionics Systems API Gateway
    version: 1.0.0
    contact:
      name: Avionics Systems Team
      email: platform@avionics-systems.local
      url: https://avionics-systems.local
    license:
      name: Apache 2.0
      url: https://www.apache.org/licenses/LICENSE-2.0
    servers:
      gateway-url: http://localhost:8080
      auth-url: http://localhost:8081
      user-url: http://localhost:8082
      project-url: http://localhost:8083
      issue-url: http://localhost:8084
      workflow-url: http://localhost:8085

# Resilience Configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        failureRateThreshold: 50
        slidingWindowSize: 10
        waitDurationInOpenState: 30s
        minimumNumberOfCalls: 5
    instances:
      default:
        register-health-indicator: true
        sliding-window-size: 10
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
    instances:
      default:
        max-attempts: 3
        wait-duration: 500ms