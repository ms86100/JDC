name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - feature/**
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ms86100

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push all services
        run: |
          set -e

          services=(
            "auth-service"
            "gateway"
            "user-service"
            "project-service"
            "workflow-service"
            "comment-service"
            "notification-service"
            "search-service"
            "audit-service"
            "attachment-service"
            "sprint-service"
            "plan-service"
            "admin-service"
            "migration-service"
            "version-service"
            "component-service"
            "issue-service"
            "test-service"
            "dashboard-service"
            "portal-service"
            "report-service"
            "document-service"
          )

          for service in "${services[@]}"; do
            echo "=========================================="
            echo "Building: jira-$service"
            echo "=========================================="
            docker build \
              --platform linux/amd64 \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-$service:${{ github.sha }} \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-$service:latest \
              -f jira-$service/Dockerfile .
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-$service:${{ github.sha }}
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-$service:latest
            echo ""
          done

      - name: Build and push frontend
        run: |
          echo "=========================================="
          echo "Building: jira-frontend"
          echo "=========================================="
          docker build \
            --platform linux/amd64 \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-frontend:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-frontend:latest \
            -f jira-frontend/Dockerfile .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-frontend:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-frontend:latest

  success:
    runs-on: ubuntu-latest
    needs: build-backend
    if: always()
    steps:
      - name: Success message
        run: |
          echo "=========================================="
          echo " All Docker images built and pushed!"
          echo "=========================================="
          echo "Images available at: https://github.com/ms86100/JDC/pkgs/container"
          echo ""
          echo "Services built: auth-service, gateway, user-service, project-service,"
          echo "issue-service, workflow-service, comment-service, notification-service,"
          echo "search-service, audit-service, attachment-service, sprint-service,"
          echo "plan-service, admin-service, migration-service, version-service,"
          echo "component-service, test-service, dashboard-service, portal-service,"
          echo "report-service, document-service, frontend"