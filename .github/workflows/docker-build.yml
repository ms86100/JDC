name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - feature/**
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend services in parallel
        run: |
          set -e
          services=(
            "auth-service"
            "gateway"
            "user-service"
            "project-service"
            "workflow-service"
            "comment-service"
            "notification-service"
            "search-service"
            "audit-service"
            "attachment-service"
            "sprint-service"
            "plan-service"
            "admin-service"
            "migration-service"
            "version-service"
            "component-service"
          )

          for service in "${services[@]}"; do
            echo "=========================================="
            echo "Building: jira-$service"
            echo "=========================================="
            docker build \
              --cache-from ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-$service:latest \
              --build-arg BUILDKIT_INLINE_CACHE=1 \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-$service:${{ github.sha }} \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-$service:latest \
              -f jira-$service/Dockerfile .
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-$service:${{ github.sha }}
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-$service:latest
            echo ""
          done

      - name: Build issue-service (with dependencies)
        run: |
          echo "=========================================="
          echo "Building: jira-issue-service"
          echo "=========================================="
          docker build \
            --cache-from ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-issue-service:latest \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-issue-service:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-issue-service:latest \
            -f jira-issue-service/Dockerfile .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-issue-service:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-issue-service:latest

      - name: Build remaining services
        run: |
          set -e
          services=(
            "test-service"
            "dashboard-service"
            "portal-service"
            "report-service"
            "document-service"
          )

          for service in "${services[@]}"; do
            echo "=========================================="
            echo "Building: jira-$service"
            echo "=========================================="
            docker build \
              --cache-from ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-$service:latest \
              --build-arg BUILDKIT_INLINE_CACHE=1 \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-$service:${{ github.sha }} \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-$service:latest \
              -f jira-$service/Dockerfile .
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-$service:${{ github.sha }}
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-$service:latest
            echo ""
          done

  build-frontend:
    runs-on: ubuntu-latest
    needs: build-backend
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend
        run: |
          echo "=========================================="
          echo "Building: jira-frontend"
          echo "=========================================="
          docker build \
            --cache-from ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-frontend:latest \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-frontend:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-frontend:latest \
            -f jira-frontend/Dockerfile .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-frontend:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-frontend:latest

  summary:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    steps:
      - name: Summary
        run: |
          echo "=========================================="
          echo " Build Complete!"
          echo "=========================================="
          echo "Images pushed to: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}"
          echo ""
          echo "Available images:"
          echo "  - jira-auth-service"
          echo "  - jira-gateway"
          echo "  - jira-user-service"
          echo "  - jira-project-service"
          echo "  - jira-issue-service"
          echo "  - jira-workflow-service"
          echo "  - jira-comment-service"
          echo "  - jira-notification-service"
          echo "  - jira-search-service"
          echo "  - jira-audit-service"
          echo "  - jira-attachment-service"
          echo "  - jira-sprint-service"
          echo "  - jira-plan-service"
          echo "  - jira-admin-service"
          echo "  - jira-migration-service"
          echo "  - jira-version-service"
          echo "  - jira-component-service"
          echo "  - jira-frontend"
          echo ""
          echo "View at: https://github.com/${{ github.repository }}/packages"