name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - feature/**
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ms86100
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'false'

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push all services
        run: |
          set -e
          shopt -s nullglob

          echo "=========================================="
          echo "Building Jira Platform Services"
          echo "=========================================="

          for service in auth-service gateway user-service project-service workflow-service comment-service notification-service search-service audit-service attachment-service sprint-service plan-service admin-service migration-service version-service component-service; do
            if [ -d "jira-$service" ]; then
              echo ""
              echo ">>> Building jira-$service"
              docker build \
                --platform linux/amd64 \
                -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-$service:${{ github.sha }} \
                -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-$service:latest \
                -f jira-$service/Dockerfile .
              docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-$service:${{ github.sha }}
              docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-$service:latest
            fi
          done

      - name: Build issue-service (with dependencies)
        run: |
          echo ""
          echo ">>> Building jira-issue-service"
          docker build \
            --platform linux/amd64 \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-issue-service:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-issue-service:latest \
            -f jira-issue-service/Dockerfile .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-issue-service:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-issue-service:latest

      - name: Build remaining services
        run: |
          for service in test-service dashboard-service portal-service report-service document-service; do
            if [ -d "jira-$service" ]; then
              echo ""
              echo ">>> Building jira-$service"
              docker build \
                --platform linux/amd64 \
                -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-$service:${{ github.sha }} \
                -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-$service:latest \
                -f jira-$service/Dockerfile .
              docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-$service:${{ github.sha }}
              docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-$service:latest
            fi
          done

      - name: Build and push frontend
        run: |
          echo ""
          echo ">>> Building jira-frontend"
          docker build \
            --platform linux/amd64 \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-frontend:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-frontend:latest \
            -f jira-frontend/Dockerfile .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-frontend:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jira-frontend:latest

      - name: Show success
        run: |
          echo ""
          echo "=========================================="
          echo " All images built and pushed successfully!"
          echo "=========================================="
          echo "View packages at: https://github.com/ms86100/JDC/pkgs/container"