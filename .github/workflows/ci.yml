name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jiraadmin
          POSTGRES_PASSWORD: jirapass
          POSTGRES_DB: jira_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build cluster-commons
        run: mvn clean install -pl jira-cluster-commons -DskipTests -q

      - name: Build all services
        run: mvn clean compile -DskipTests -q

      - name: Run ArchUnit cluster safety tests
        run: |
          for service in jira-issue-service jira-workflow-service jira-notification-service jira-user-service jira-sprint-service jira-plan-service jira-test-service jira-migration-service; do
            echo "Testing $service..."
            mvn test -pl $service -Dtest="*ClusterArchTest" -q || exit 1
          done

      - name: Validate Docker Compose
        run: bash scripts/validate-cluster-readiness.sh docker-compose.yml

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build all JARs
        run: mvn clean package -DskipTests -q

      - name: Build Docker images
        run: docker compose build

      - name: Verify Docker Compose starts
        run: |
          docker compose up -d postgres redis
          sleep 10
          docker compose up -d
          sleep 30
          docker compose ps
          docker compose down
