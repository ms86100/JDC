networks:
  jira-network:
    driver: bridge

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: jira-postgres
    environment:
      POSTGRES_USER: jiraadmin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jirapass}
      POSTGRES_DB: jira_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    ports:
      - "5432:5432"
    networks:
      - jira-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jiraadmin -d jira_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./jira-auth-service
      dockerfile: Dockerfile
    container_name: jira-auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: jira_platform
      DB_USERNAME: jiraadmin
      DB_PASSWORD: ${DB_PASSWORD:-jirapass}
      JAVA_OPTS: -Xms128m -Xmx256m
      JWT_SECRET: jira-platform-super-secret-key-that-is-at-least-256-bits-long
      JWT_EXPIRATION_MS: 900000
      JWT_REFRESH_EXPIRATION_MS: 28800000
    networks:
      - jira-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  user-service:
    build:
      context: ./jira-user-service
      dockerfile: Dockerfile
    container_name: jira-user-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: jira_platform
      DB_USERNAME: jiraadmin
      DB_PASSWORD: ${DB_PASSWORD:-jirapass}
      JAVA_OPTS: -Xms128m -Xmx256m
    networks:
      - jira-network
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  project-service:
    build:
      context: ./jira-project-service
      dockerfile: Dockerfile
    container_name: jira-project-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: jira_platform
      DB_USERNAME: jiraadmin
      DB_PASSWORD: ${DB_PASSWORD:-jirapass}
      JAVA_OPTS: -Xms128m -Xmx256m
    networks:
      - jira-network
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  issue-service:
    build:
      context: ./jira-issue-service
      dockerfile: Dockerfile
    container_name: jira-issue-service
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: jira_platform
      DB_USERNAME: jiraadmin
      DB_PASSWORD: ${DB_PASSWORD:-jirapass}
      JAVA_OPTS: -Xms128m -Xmx256m
      WORKFLOW_SERVICE_URL: http://workflow-service:8085
      PROJECT_SERVICE_URL: http://project-service:8083
      JIRA_PERMISSIONS_FAIL_OPEN: "false"
    networks:
      - jira-network
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  workflow-service:
    build:
      context: ./jira-workflow-service
      dockerfile: Dockerfile
    container_name: jira-workflow-service
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: jira_platform
      DB_USERNAME: jiraadmin
      DB_PASSWORD: ${DB_PASSWORD:-jirapass}
      JAVA_OPTS: -Xms128m -Xmx256m
    networks:
      - jira-network
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  sprint-service:
    build:
      context: ./jira-sprint-service
      dockerfile: Dockerfile
    container_name: jira-sprint-service
    ports:
      - "8091:8091"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: jira_platform
      DB_USERNAME: jiraadmin
      DB_PASSWORD: ${DB_PASSWORD:-jirapass}
      JAVA_OPTS: -Xms128m -Xmx256m
    networks:
      - jira-network
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  gateway:
    build:
      context: ./jira-gateway
      dockerfile: Dockerfile
    image: jira-gateway:latest
    container_name: jira-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: -Xms128m -Xmx256m
    networks:
      - jira-network
    depends_on:
      - auth-service
      - user-service
      - project-service
      - issue-service

  migration-service:
    image: jira-migration-service:latest
    container_name: jira-migration-service
    ports:
      - "8094:8094"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: jira_platform
      DB_USERNAME: jiraadmin
      DB_PASSWORD: ${DB_PASSWORD:-jirapass}
      JAVA_OPTS: -Xms256m -Xmx512m
    networks:
      - jira-network
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  frontend:
    build:
      context: ./jira-frontend
      dockerfile: Dockerfile
    container_name: jira-frontend
    ports:
      - "3000:80"
    networks:
      - jira-network
    depends_on:
      - gateway
      - migration-service
