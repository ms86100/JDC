networks:
  avionics-systems-network:
    driver: bridge

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: avionics-systems-postgres
    environment:
      POSTGRES_USER: avionicsadmin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-avionicspass}
      POSTGRES_DB: avionics_systems_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    ports:
      - "5432:5432"
    networks:
      - avionics-systems-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avionicsadmin -d avionics_systems_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./avionics-systems-auth-service
      dockerfile: Dockerfile
    container_name: avionics-systems-auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: avionics_systems_platform
      DB_USERNAME: avionicsadmin
      DB_PASSWORD: ${DB_PASSWORD:-avionicspass}
      JAVA_OPTS: -Xms128m -Xmx256m
      JWT_SECRET: avionics-systems-platform-super-secret-key-that-is-at-least-256-bits-long
      JWT_EXPIRATION_MS: 900000
      JWT_REFRESH_EXPIRATION_MS: 28800000
    networks:
      - avionics-systems-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  user-service:
    build:
      context: ./avionics-systems-user-service
      dockerfile: Dockerfile
    container_name: avionics-systems-user-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: avionics_systems_platform
      DB_USERNAME: avionicsadmin
      DB_PASSWORD: ${DB_PASSWORD:-avionicspass}
      JAVA_OPTS: -Xms128m -Xmx256m
    networks:
      - avionics-systems-network
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  project-service:
    build:
      context: ./avionics-systems-project-service
      dockerfile: Dockerfile
    container_name: avionics-systems-project-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: avionics_systems_platform
      DB_USERNAME: avionicsadmin
      DB_PASSWORD: ${DB_PASSWORD:-avionicspass}
      JAVA_OPTS: -Xms128m -Xmx256m
    networks:
      - avionics-systems-network
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  issue-service:
    build:
      context: ./avionics-systems-issue-service
      dockerfile: Dockerfile
    container_name: avionics-systems-issue-service
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: avionics_systems_platform
      DB_USERNAME: avionicsadmin
      DB_PASSWORD: ${DB_PASSWORD:-avionicspass}
      JAVA_OPTS: -Xms128m -Xmx256m
      WORKFLOW_SERVICE_URL: http://workflow-service:8085
      PROJECT_SERVICE_URL: http://project-service:8083
      AVIONICS_SYSTEMS_PERMISSIONS_FAIL_OPEN: "false"
    networks:
      - avionics-systems-network
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  workflow-service:
    build:
      context: ./avionics-systems-workflow-service
      dockerfile: Dockerfile
    container_name: avionics-systems-workflow-service
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: avionics_systems_platform
      DB_USERNAME: avionicsadmin
      DB_PASSWORD: ${DB_PASSWORD:-avionicspass}
      JAVA_OPTS: -Xms128m -Xmx256m
    networks:
      - avionics-systems-network
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  sprint-service:
    build:
      context: ./avionics-systems-sprint-service
      dockerfile: Dockerfile
    container_name: avionics-systems-sprint-service
    ports:
      - "8091:8091"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: avionics_systems_platform
      DB_USERNAME: avionicsadmin
      DB_PASSWORD: ${DB_PASSWORD:-avionicspass}
      JAVA_OPTS: -Xms128m -Xmx256m
    networks:
      - avionics-systems-network
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  gateway:
    build:
      context: ./avionics-systems-gateway
      dockerfile: Dockerfile
    image: avionics-systems-gateway:latest
    container_name: avionics-systems-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: -Xms128m -Xmx256m
    networks:
      - avionics-systems-network
    depends_on:
      - auth-service
      - user-service
      - project-service
      - issue-service

  migration-service:
    image: avionics-systems-migration-service:latest
    container_name: avionics-systems-migration-service
    ports:
      - "8094:8094"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: avionics_systems_platform
      DB_USERNAME: avionicsadmin
      DB_PASSWORD: ${DB_PASSWORD:-avionicspass}
      JAVA_OPTS: -Xms256m -Xmx512m
    networks:
      - avionics-systems-network
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  frontend:
    build:
      context: ./avionics-systems-frontend
      dockerfile: Dockerfile
    container_name: avionics-systems-frontend
    ports:
      - "3000:80"
    networks:
      - avionics-systems-network
    depends_on:
      - gateway
      - migration-service
