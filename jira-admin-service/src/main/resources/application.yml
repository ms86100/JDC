server:
  port: 8093
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
  tomcat:
    threads:
      max: 200
      min-spare: 20
    max-connections: 8192
    accept-count: 100

spring:
  application:
    name: jira-admin-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jira_platform}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 20000
      leak-detection-threshold: 30000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: jira_admin
        hbm2ddl:
          create_namespaces: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 500
        generate_statistics: false

  flyway:
    enabled: true
    schemas: jira_admin
    default-schema: jira_admin
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false
    locations: classpath:db/migration

  lifecycle:
    timeout-per-shutdown-phase: 30s

jira:
  services:
    project-url: ${PROJECT_SERVICE_URL:http://localhost:8083}
    issue-url: ${ISSUE_SERVICE_URL:http://localhost:8084}
    workflow-url: ${WORKFLOW_SERVICE_URL:http://localhost:8085}

# Configurable application defaults (Pattern B)
app:
  defaults:
    user-role: USER
    timezone: UTC
    language: en-US
    password-hash-placeholder: "$2a$10$placeholder"
    system-role-names: Administrators,Developers,Users
    status-color: "#6C757D"
    status-category: TODO
    issue-type-icon: standard
    permission-category: CUSTOM
    config-value-type: STRING
    config-category: custom
    audit-severity: INFO
    audit-source: UI
    application-link-name: Confluence
    application-type: confluence
    link-direction: two-way
    link-initial-status: pending
    asset-status: ACTIVE
    asset-link-type: RELATED
    ldap-port: 389
    ldap-sync-interval: 60
    password-min-length: 8
    password-max-length: 128
    password-prevent-reuse: 5
    password-expire-days: 90
    password-lockout-attempts: 5
    password-lockout-duration: 30
  backup:
    status:
      in-progress: IN_PROGRESS
      completed: COMPLETED
      failed: FAILED
    schedule:
      default-cron: "0 0 2 * * ?"
      default-retention-days: 30
  health:
    service-names: Database,Email Service,File Storage
  permissions:
    admin-group-id: grp-jira-administrators
    admin-role-id: role-admin
    group-id-prefix: "grp-"
  screen:
    tab:
      description-fields: summary,description,environment
      details-create-fields: issuetype,priority,assignee,reporter,labels,security,duedate,components,fixVersions,affectsVersions
      details-edit-fields: issuetype,priority,assignee,reporter,labels,security,duedate,components,fixVersions,affectsVersions,linkedIssues,subtasks,attachment
      people-fields: watcher,vote,comment
      development-fields: sprint,epic,storyPoints,flagged,worklog
      activity-fields: activity

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.jira: DEBUG
    org.hibernate.SQL: WARN
  file:
    path: ${LOG_PATH:../../logs}/admin
