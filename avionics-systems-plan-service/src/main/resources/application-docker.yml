server:
  port: 8092

spring:
  application:
    name: avionics-systems-plan-service
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:plan_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: jira_plan
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    default-schema: jira_plan
    schemas: jira_plan
    create-schemas: true
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.avionics_systems.plan: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  file:
    path: ${LOG_PATH:../../logs}/plan

# Service URLs for inter-service communication
services:
  projectServiceUrl: ${PROJECT_SERVICE_URL:http://project-service:8083}
  issueServiceUrl: ${ISSUE_SERVICE_URL:http://issue-service:8084}
  userServiceUrl: ${USER_SERVICE_URL:http://user-service:8082}
  sprintServiceUrl: ${SPRINT_SERVICE_URL:http://sprint-service:8091}