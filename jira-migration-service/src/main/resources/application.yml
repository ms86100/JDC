server:
  port: 8094
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
  tomcat:
    threads:
      max: 200
      min-spare: 20
    max-connections: 8192
    accept-count: 100

jwt:
  secret: ${JWT_SECRET:jira-platform-super-secret-key-that-is-at-least-256-bits-long}

migration:
  security:
    enabled: true
    require-jwt: ${MIGRATION_REQUIRE_JWT:false}
  attachment:
    chunk-size-bytes: 2097152
    chunked-threshold-bytes: 2097152
    # Jira DC default 10 MB; max configurable up to 2 GB (2147483647)
    max-size-bytes: ${MIGRATION_ATTACHMENT_MAX_BYTES:10485760}
  import:
    # Jira DC: FILE:filename resolves under this dir (JIRA_HOME/import/attachments)
    attachments-dir: ${MIGRATION_IMPORT_ATTACHMENTS_DIR:}
  clamav:
    enabled: ${CLAMAV_ENABLED:false}
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
  events:
    publish-interval-ms: 15000
  retry:
    process-interval-ms: 20000

spring:
  application:
    name: jira-migration-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jira_platform}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 20000
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: jira_migration
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 500
        generate_statistics: false
  flyway:
    enabled: true
    schemas: jira_migration
    default-schema: jira_migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false
    locations: classpath:db/migration
    table: flyway_schema_history
  data:
    redis:
      repositories:
        enabled: false

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}

resilience4j:
  circuitbreaker:
    configs:
      default:
        failureRateThreshold: 50
        slidingWindowSize: 10
        waitDurationInOpenState: 30s
        minimumNumberOfCalls: 5
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    com.jira.migration: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  file:
    path: ${LOG_PATH:../../logs}/migration

job:
  recovery:
    enabled: false
    checkInterruptedOnStartup: false

services:
  gatewayServiceUrl: ${GATEWAY_SERVICE_URL:http://localhost:8080}
  authServiceUrl: ${AUTH_SERVICE_URL:http://localhost:8081}
  userServiceUrl: ${USER_SERVICE_URL:http://localhost:8082}
  projectServiceUrl: ${PROJECT_SERVICE_URL:http://localhost:8083}
  issueServiceUrl: ${ISSUE_SERVICE_URL:http://localhost:8084}
  workflowServiceUrl: ${WORKFLOW_SERVICE_URL:http://localhost:8085}
  commentServiceUrl: ${COMMENT_SERVICE_URL:http://localhost:8086}
  notificationServiceUrl: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
  searchServiceUrl: ${SEARCH_SERVICE_URL:http://localhost:8088}
  auditServiceUrl: ${AUDIT_SERVICE_URL:http://localhost:8089}
  attachmentServiceUrl: ${ATTACHMENT_SERVICE_URL:http://localhost:8090}
  sprintServiceUrl: ${SPRINT_SERVICE_URL:http://localhost:8091}
  planServiceUrl: ${PLAN_SERVICE_URL:http://localhost:8092}
  adminServiceUrl: ${ADMIN_SERVICE_URL:http://localhost:8093}
  migrationServiceUrl: ${MIGRATION_SERVICE_URL:http://localhost:8094}
  testServiceUrl: ${TEST_SERVICE_URL:http://localhost:8095}

jira:
  services:
    workflow-url: ${WORKFLOW_SERVICE_URL:http://localhost:8085}
    issue-url: ${ISSUE_SERVICE_URL:http://localhost:8084}

cluster:
  enabled: false
  lock:
    type: DATABASE
  port: 8095
