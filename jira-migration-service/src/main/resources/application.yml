server:
  port: 8094

jwt:
  secret: ${JWT_SECRET:jira-platform-super-secret-key-that-is-at-least-256-bits-long}

migration:
  security:
    enabled: true
    require-jwt: ${MIGRATION_REQUIRE_JWT:false}
  attachment:
    chunk-size-bytes: 2097152
    chunked-threshold-bytes: 2097152
    # Jira DC default 10 MB; max configurable up to 2 GB (2147483647)
    max-size-bytes: ${MIGRATION_ATTACHMENT_MAX_BYTES:10485760}
  import:
    # Jira DC: FILE:filename resolves under this dir (JIRA_HOME/import/attachments)
    attachments-dir: ${MIGRATION_IMPORT_ATTACHMENTS_DIR:}
  clamav:
    enabled: ${CLAMAV_ENABLED:false}
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
  events:
    publish-interval-ms: 15000
  retry:
    process-interval-ms: 20000

spring:
  application:
    name: jira-migration-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jira_platform}
    username: ${DB_USERNAME:jiraadmin}
    password: ${DB_PASSWORD:UNIpay@123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: jira_migration
  flyway:
    enabled: true
    schemas: jira_migration
    default-schema: jira_migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false
    locations: classpath:db/migration
    table: flyway_schema_history
  data:
    redis:
      repositories:
        enabled: false

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    com.jira.migration: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  file:
    path: ${LOG_PATH:../../logs}/migration

job:
  recovery:
    enabled: false
    checkInterruptedOnStartup: false

services:
  gatewayServiceUrl: ${GATEWAY_SERVICE_URL:http://localhost:8080}
  authServiceUrl: ${AUTH_SERVICE_URL:http://${DB_HOST:-postgres}:${DB_PORT:-5432}}
  userServiceUrl: ${USER_SERVICE_URL:http://${DB_HOST:-postgres}:${DB_PORT:-5432}}
  projectServiceUrl: ${PROJECT_SERVICE_URL:http://${DB_HOST:-postgres}:${DB_PORT:-5432}}
  issueServiceUrl: ${ISSUE_SERVICE_URL:http://${DB_HOST:-postgres}:${DB_PORT:-5432}}
  workflowServiceUrl: ${WORKFLOW_SERVICE_URL:http://${DB_HOST:-postgres}:${DB_PORT:-5432}}
  commentServiceUrl: ${COMMENT_SERVICE_URL:http://${DB_HOST:-postgres}:${DB_PORT:-5432}}
  notificationServiceUrl: ${NOTIFICATION_SERVICE_URL:http://${DB_HOST:-postgres}:${DB_PORT:-5432}}
  searchServiceUrl: ${SEARCH_SERVICE_URL:http://${DB_HOST:-postgres}:${DB_PORT:-5432}}
  auditServiceUrl: ${AUDIT_SERVICE_URL:http://${DB_HOST:-postgres}:${DB_PORT:-5432}}
  attachmentServiceUrl: ${ATTACHMENT_SERVICE_URL:http://${DB_HOST:-postgres}:${DB_PORT:-5432}}
  sprintServiceUrl: ${SPRINT_SERVICE_URL:http://${DB_HOST:-postgres}:${DB_PORT:-5432}}
  planServiceUrl: ${PLAN_SERVICE_URL:http://${DB_HOST:-postgres}:${DB_PORT:-5432}}
  adminServiceUrl: ${ADMIN_SERVICE_URL:http://${DB_HOST:-postgres}:${DB_PORT:-5432}}
  migrationServiceUrl: ${MIGRATION_SERVICE_URL:http://${DB_HOST:-postgres}:${DB_PORT:-5432}}
  testServiceUrl: ${TEST_SERVICE_URL:http://${DB_HOST:-postgres}:${DB_PORT:-5432}}

jira:
  services:
    workflow-url: ${WORKFLOW_SERVICE_URL:http://${DB_HOST:-postgres}:${DB_PORT:-5432}}
    issue-url: ${ISSUE_SERVICE_URL:http://${DB_HOST:-postgres}:${DB_PORT:-5432}}

cluster:
  enabled: false
  lock:
    type: DATABASE
  port: 8095
