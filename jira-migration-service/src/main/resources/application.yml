server:
  port: 8094

migration:
  security:
    enabled: true
  attachment:
    chunk-size-bytes: 2097152
    chunked-threshold-bytes: 2097152
  clamav:
    enabled: ${CLAMAV_ENABLED:false}
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
  events:
    publish-interval-ms: 15000
  retry:
    process-interval-ms: 20000

spring:
  application:
    name: jira-migration-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jira_platform}
    username: ${DB_USERNAME:jiraadmin}
    password: ${DB_PASSWORD:UNIpay@123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: jira_migration
  flyway:
    enabled: true
    schemas: jira_migration
    default-schema: jira_migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false
    locations: classpath:db/migration
    table: flyway_schema_history
  data:
    redis:
      repositories:
        enabled: false

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    com.jira.migration: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  file:
    path: ${LOG_PATH:../../logs}/migration

job:
  recovery:
    enabled: false
    checkInterruptedOnStartup: false

services:
  userServiceUrl: ${USER_SERVICE_URL:http://localhost:8082}
  projectServiceUrl: ${PROJECT_SERVICE_URL:http://localhost:8083}
  issueServiceUrl: ${ISSUE_SERVICE_URL:http://localhost:8084}
  adminServiceUrl: ${ADMIN_SERVICE_URL:http://localhost:8093}
  searchServiceUrl: ${SEARCH_SERVICE_URL:http://localhost:8085}

jira:
  services:
    workflow-url: ${WORKFLOW_SERVICE_URL:http://localhost:8085}
    issue-url: ${ISSUE_SERVICE_URL:http://localhost:8084}

cluster:
  enabled: false
  lock:
    type: DATABASE
  port: 8095
