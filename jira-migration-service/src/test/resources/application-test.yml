server:
  port: 8090

spring:
  application:
    name: jira-migration-service-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

async:
  core-pool-size: 2
  max-pool-size: 4
  queue-capacity: 100
  thread-name-prefix: migration-test-

logging:
  level:
    com.jira.migration: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    com.jira.migration.async: TRACE
