networks:
  avionics-systems-network:
    driver: bridge

volumes:
  postgres_data:
  attachment_data:
  redis_data:
  minio_data:

services:
  # =============================================================================
  # INFRASTRUCTURE (container_name + ports allowed — these are singletons)
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: avionics-systems-postgres
    command: postgres -c max_connections=300
    environment:
      POSTGRES_USER: avionicsadmin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-avionicspass}
      POSTGRES_DB: avionics_systems_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    ports:
      - "5432:5432"
    networks:
      - avionics-systems-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avionicsadmin"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-replica:
    image: postgres:16-alpine
    container_name: avionics-systems-postgres-replica
    environment:
      PGPASSWORD: ${DB_PASSWORD:-avionicspass}
    command: >
      bash -c "
      until pg_isready -h avionics-systems-postgres -U avionicsadmin; do sleep 2; done;
      rm -rf /var/lib/postgresql/data/*;
      chown postgres:postgres /var/lib/postgresql/data;
      chmod 700 /var/lib/postgresql/data;
      su postgres -c 'pg_basebackup -h avionics-systems-postgres -U avionicsadmin -D /var/lib/postgresql/data -Fp -Xs -R';
      su postgres -c 'postgres -c hot_standby=on -c max_connections=300'
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - avionics-systems-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avionicsadmin -d avionics_systems_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: avionics-systems-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-avionicsRedis2026!}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - avionics-systems-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: avionics-systems-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - avionics-systems-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: avionics-systems-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - avionics-systems-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: avionics-systems-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - avionics-systems-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: avionics-systems-zipkin
    ports:
      - "9411:9411"
    networks:
      - avionics-systems-network

  prometheus:
    image: prom/prometheus:latest
    container_name: avionics-systems-prometheus
    volumes:
      - ./enterprise-architecture/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./enterprise-architecture/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
    ports:
      - "9090:9090"
    networks:
      - avionics-systems-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'

  grafana:
    image: grafana/grafana:latest
    container_name: avionics-systems-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./enterprise-architecture/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./enterprise-architecture/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3001:3000"
    networks:
      - avionics-systems-network
    depends_on:
      - prometheus

  # =============================================================================
  # GATEWAY — Load Balancer entry point (ports allowed — user-facing)
  # Routes use Docker DNS service names for round-robin load balancing.
  # Scale: docker compose up --scale gateway=2
  # =============================================================================
  gateway:
    build:
      context: ./avionics-systems-gateway
      dockerfile: Dockerfile
    image: avionics-systems-gateway:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: -Xms64m -Xmx192m -XX:+UseSerialGC
      JWT_SECRET: avionics-systems-platform-super-secret-key-that-is-at-least-256-bits-long
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-avionicsRedis2026!}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-avionicsRedis2026!}
      CLUSTER_STORAGE_BASE_PATH: /var/avionics-systems/shared
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    networks:
      - avionics-systems-network
    depends_on:
      - auth-service
      - user-service
      - project-service
      - issue-service

  # =============================================================================
  # APPLICATION NODES — No container_name, no fixed ports (scalable)
  # Scale any service: docker compose up --scale issue-service=3
  # Docker DNS round-robins requests across all instances automatically.
  # =============================================================================
  auth-service:
    build:
      context: ./avionics-systems-auth-service
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: avionics_systems_platform
      DB_USERNAME: avionicsadmin
      DB_PASSWORD: ${DB_PASSWORD:-avionicspass}
      JAVA_OPTS: -Xms64m -Xmx192m -XX:+UseSerialGC
      JWT_SECRET: avionics-systems-platform-super-secret-key-that-is-at-least-256-bits-long
      JWT_EXPIRATION_MS: 900000
      JWT_REFRESH_EXPIRATION_MS: 28800000
      ADMIN_PASSWORD: Admin123!
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-avionicsRedis2026!}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-avionicsRedis2026!}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    networks:
      - avionics-systems-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 240s

