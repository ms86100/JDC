networks:
  jira-network:
    driver: bridge

volumes:
  postgres_data:
  attachment_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: jira-postgres
    environment:
      POSTGRES_USER: jiraadmin
      POSTGRES_PASSWORD: jirapass123
      POSTGRES_DB: jira_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    ports:
      - "5432:5432"
    networks:
      - jira-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jiraadmin"]
      interval: 10s
      timeout: 5s
      retries: 5

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: jira-zipkin
    ports:
      - "9411:9411"
    networks:
      - jira-network

  # =============================================================================
  # GATEWAY
  # =============================================================================
  gateway:
    build:
      context: ./jira-gateway
      dockerfile: Dockerfile
    image: jira-gateway:latest
    container_name: jira-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: -Xms256m -Xmx512m
    networks:
      - jira-network
    depends_on:
      - auth-service
      - user-service
      - project-service
      - issue-service

  # =============================================================================
  # SERVICES
  # =============================================================================
  auth-service:
    build:
      context: ./jira-auth-service
      dockerfile: Dockerfile
    container_name: jira-auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: jira_platform
      DB_USERNAME: jiraadmin
      DB_PASSWORD: jirapass123
      JAVA_OPTS: -Xms256m -Xmx512m
      JWT_SECRET: jira-platform-super-secret-key-that-is-at-least-256-bits-long
      JWT_EXPIRATION_MS: 86400000
      JWT_REFRESH_EXPIRATION_MS: 604800000
    networks:
      - jira-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  user-service:
    build:
      context: ./jira-user-service
      dockerfile: Dockerfile
    container_name: jira-user-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: jira_platform
      DB_USERNAME: jiraadmin
      DB_PASSWORD: jirapass123
      JAVA_OPTS: -Xms256m -Xmx512m
    networks:
      - jira-network
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  project-service:
