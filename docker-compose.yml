networks:
  jira-network:
    driver: bridge

volumes:
  postgres_data: {}
  attachment_data: {}

services:
  # =============================================================================
  # POSTGRES - Single database with multiple schemas
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: jira-postgres
    environment:
      POSTGRES_USER: jiraadmin
      POSTGRES_PASSWORD: jirapass123
      POSTGRES_DB: jira_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql:ro
    ports:
      - "5432:5432"
    networks:
      - jira-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jiraadmin -d jira_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # REDIS - For caching (optional but recommended)
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: jira-redis
    ports:
      - "6379:6379"
    networks:
      - jira-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =============================================================================
  # ZIPKIN - Distributed tracing
  # =============================================================================
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: jira-zipkin
    ports:
      - "9411:9411"
    networks:
      - jira-network

  # =============================================================================
  # GATEWAY - API Gateway (no Eureka needed, uses static routes)
  # =============================================================================
  gateway:
    build:
      context: ./jira-gateway
      dockerfile: Dockerfile
    container_name: jira-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JAVA_OPTS: -Xms256m -Xmx512m
    networks:
      - jira-network
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      project-service:
        condition: service_healthy
      issue-service:
        condition: service_healthy

  # =============================================================================
  # AUTH SERVICE - Must start first (others depend on it)
  # =============================================================================
  auth-service:
    build:
      context: ./jira-auth-service
      dockerfile: Dockerfile
    container_name: jira-auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: jira_platform
      DB_USERNAME: jiraadmin
      DB_PASSWORD: jirapass123
      JWT_SECRET: jira-platform-super-secret-key-that-is-at-least-256-bits-long
      JWT_EXPIRATION_MS: 86400000
      JWT_REFRESH_EXPIRATION_MS: 604800000
      JAVA_OPTS: -Xms256m -Xmx512m
    networks:
      - jira-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # =============================================================================
  # USER SERVICE
  # =============================================================================
  user-service:
    build:
      context: ./jira-user-service
      dockerfile: Dockerfile
    container_name: jira-user-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: jira_platform
      DB_USERNAME: jiraadmin
      DB_PASSWORD: jirapass123
      AUTH_SERVICE_URL: http://auth-service:8081
      JAVA_OPTS: -Xms256m -Xmx512m
    networks:
      - jira-network
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # =============================================================================
