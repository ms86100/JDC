      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-jiraRedis2026!}
