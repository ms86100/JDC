networks:
  jira-network:
    driver: bridge

volumes:
  postgres_data:
  attachment_data:
  redis_data:
  minio_data:

services:
  # =============================================================================
  # INFRASTRUCTURE (container_name + ports allowed — these are singletons)
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: jira-postgres
    command: postgres -c max_connections=300
    environment:
      POSTGRES_USER: jiraadmin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jirapass}
      POSTGRES_DB: jira_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    ports:
      - "5432:5432"
    networks:
      - jira-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jiraadmin"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jira-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-jiraRedis2026!}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - jira-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: jira-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - jira-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: jira-zipkin
    ports:
      - "9411:9411"
    networks:
      - jira-network

  # =============================================================================
  # GATEWAY — Load Balancer entry point (ports allowed — user-facing)
  # Routes use Docker DNS service names for round-robin load balancing.
  # Scale: docker compose up --scale gateway=2
  # =============================================================================
  gateway:
    build:
      context: ./jira-gateway
      dockerfile: Dockerfile
    image: jira-gateway:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: -Xms64m -Xmx192m -XX:+UseSerialGC
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-jiraRedis2026!}
    networks:
      - jira-network
    depends_on:
      - auth-service
      - user-service
      - project-service
      - issue-service

  # =============================================================================
  # APPLICATION NODES — No container_name, no fixed ports (scalable)
  # Scale any service: docker compose up --scale issue-service=3
  # Docker DNS round-robins requests across all instances automatically.
  # =============================================================================
  auth-service:
    build:
      context: ./jira-auth-service
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: jira_platform
      DB_USERNAME: jiraadmin
      DB_PASSWORD: ${DB_PASSWORD:-jirapass}
      JAVA_OPTS: -Xms64m -Xmx192m -XX:+UseSerialGC
      JWT_SECRET: jira-platform-super-secret-key-that-is-at-least-256-bits-long
      JWT_EXPIRATION_MS: 900000
      JWT_REFRESH_EXPIRATION_MS: 28800000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-jiraRedis2026!}
    networks:
      - jira-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 240s

  user-service:
