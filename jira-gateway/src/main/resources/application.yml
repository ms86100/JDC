server:
  port: 8080

spring:
  application:
    name: jira-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}"
            allowedMethods: "*"
            allowedHeaders: "*"
            maxAge: 3600

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
    group: 'all'
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  show-actuator: true

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,caches
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
    redis:
      enabled: false

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: 3600000
  refresh-expiration-ms: 604800000

# Rate Limiting Configuration
ratelimit:
  requests-per-minute: 100
  requests-per-hour: 1000
  requests-per-day: 10000
  burst-capacity: 50

# Cache Configuration
cache:
  caffeine:
    initial-capacity: 100
    maximum-size: 500
    expire-after-write-minutes: 10
    expire-after-access-minutes: 5

# Logging Configuration
logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    com.jira.gateway: DEBUG
  file:
    path: ${LOG_PATH:../../logs}/gateway

# Resilience Configuration
resilience4j:
  circuitbreaker:
    instances:
      default:
        register-health-indicator: true
        sliding-window-size: 10
  retry:
    instances:
      default:
        max-attempts: 3
        wait-duration: 500ms