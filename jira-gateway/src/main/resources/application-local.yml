spring:
  config:
    activate:
      on-profile: local
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            exposeHeaders:
              - Access-Control-Allow-Origin
              - Access-Control-Allow-Credentials
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
        - id: project-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/projects/**
          filters:
            - StripPrefix=1
        - id: issue-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/issues/**
          filters:
            - StripPrefix=1
        - id: workflow-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/workflows/**
          filters:
            - StripPrefix=1
        - id: comment-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/comments/**
          filters:
            - StripPrefix=1
        - id: notification-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1
        - id: search-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/search/**
          filters:
            - StripPrefix=1
        - id: audit-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/audit/**
          filters:
            - StripPrefix=1
        - id: sprint-service
          uri: http://localhost:8091
          predicates:
            - Path=/api/sprints/**
          filters:
            - StripPrefix=1
        - id: attachment-service
          uri: http://localhost:8090
          predicates:
            - Path=/api/attachments/**
          filters:
            - StripPrefix=1
        - id: plan-service
          uri: http://localhost:8092
          predicates:
            - Path=/api/plans/**

jwt:
  secret: jira-platform-super-secret-key-that-is-at-least-256-bits-long