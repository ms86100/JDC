spring:
  config:
    activate:
      on-profile: local
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600
            exposeHeaders:
              - Access-Control-Allow-Credentials
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/users/**
        - id: user-service-direct
          uri: http://localhost:8082
          predicates:
            - Path=/user-service/**
          filters:
            - StripPrefix=1
        - id: project-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/projects/**
        - id: template-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/templates/**
        - id: security-levels
          uri: http://localhost:8083
          predicates:
            - Path=/api/security-levels/**
        - id: issue-service
