spring:
  config:
    activate:
      on-profile: docker
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            maxAge: 3600
      routes:
        # Auth Service (frontend uses /api/auth/*)
        - id: auth-service-api
          uri: http://jira-auth-service:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        - id: auth-service
          uri: http://jira-auth-service:8081
          predicates:
            - Path=/auth/**

        # User Service
        - id: user-service
          uri: http://jira-user-service:8082
          predicates:
            - Path=/users/**

        # Project Service (controllers use /api/projects and /api/templates paths)
        - id: project-service
          uri: http://jira-project-service:8083
          predicates:
            - Path=/api/projects/**

        - id: templates-api
          uri: http://jira-project-service:8083
          predicates:
            - Path=/api/templates/**

        - id: security-levels-api
          uri: http://jira-project-service:8083
          predicates:
            - Path=/api/security-levels/**

        - id: screen-schemes-api
          uri: http://jira-project-service:8083
          predicates:
            - Path=/api/screen-schemes/**

        # Issue Service
        - id: issue-service
          uri: http://jira-issue-service:8084
          predicates:
            - Path=/api/issues/**

        # Version Service
        - id: version-service
          uri: http://jira-version-service:8096
          predicates:
            - Path=/versions/**

        # Component Service
        - id: component-service
          uri: http://jira-component-service:8097
          predicates:
            - Path=/components/**

        # Workflow Service
        - id: workflow-service
          uri: http://jira-workflow-service:8085
          predicates:
            - Path=/workflows/**

        # Sprint Service
        - id: sprint-service
          uri: http://jira-sprint-service:8091
          predicates:
            - Path=/api/sprints/**

        - id: sprint-service-root
          uri: http://jira-sprint-service:8091
          predicates:
            - Path=/sprints/**
          filters:
            - StripPrefix=1

        # Board Service
        - id: board-service
          uri: http://jira-sprint-service:8091
          predicates:
            - Path=/api/boards/**

        - id: board-service-root
          uri: http://jira-sprint-service:8091
          predicates:
            - Path=/boards/**
          filters:
            - StripPrefix=1

        # Plan Service
        - id: plan-service
          uri: http://jira-plan-service:8092
          predicates:
            - Path=/api/plans/**

        - id: plan-service-root
          uri: http://jira-plan-service:8092
          predicates:
            - Path=/plans/**
          filters:
            - StripPrefix=1

        # Program Service
        - id: program-service
          uri: http://jira-plan-service:8092
          predicates:
            - Path=/api/programs/**
          filters:
            - StripPrefix=1

        - id: program-service-root
          uri: http://jira-plan-service:8092
          predicates:
            - Path=/programs/**
          filters:
            - StripPrefix=1

        # Migration Service
        # Migration controllers use /api/migration/* paths — do not strip prefix
        - id: migration-service
          uri: http://jira-migration-service:8094
          predicates:
            - Path=/api/migration/**

        # User Service - Jira CWD admin API (frontend uses /user-service/rest/admin/1.0/*)
        - id: user-service-admin
          uri: http://jira-user-service:8082
          predicates:
            - Path=/user-service/**
          filters:
            - StripPrefix=1

        # Admin Service
        - id: admin-service
          uri: http://jira-admin-service:8093
          predicates:
            - Path=/admin/**
          filters:
            - RewritePath=/admin(?<path>/?.*), /api/admin${path}

        - id: admin-api
          uri: http://jira-admin-service:8093
          predicates:
            - Path=/api/admin/**

        # Fields Service
        - id: fields-api
          uri: http://jira-admin-service:8093
          predicates:
            - Path=/api/fields/**
          filters:
            - StripPrefix=1

        # Comment Service
        - id: comment-service
          uri: http://jira-comment-service:8086
          predicates:
            - Path=/comments/**
        - id: comment-service-api
          uri: http://jira-comment-service:8086
          predicates:
            - Path=/api/comments/**
          filters:
            - StripPrefix=1

        # Test Service
        - id: test-service
          uri: http://jira-test-service:8095
          predicates:
            - Path=/api/tests/**
          filters:
            - StripPrefix=1

        # Notification Service
        - id: notification-service
          uri: http://jira-notification-service:8087
          predicates:
            - Path=/notifications/**

        # Search Service
        - id: search-service
          uri: http://jira-search-service:8088
          predicates:
            - Path=/search/**

        # Audit Service
        - id: audit-service
          uri: http://jira-audit-service:8089
          predicates:
            - Path=/audit/**

        - id: audit-api
          uri: http://jira-audit-service:8089
          predicates:
            - Path=/api/audit/**
          filters:
            - StripPrefix=1

        # Attachment Service
        - id: attachment-service
          uri: http://jira-attachment-service:8090
          predicates:
            - Path=/attachments/**

        # WebSocket
        - id: issue-websocket
          uri: ws://jira-issue-service:8084
          predicates:
            - Path=/ws/issues/**

        - id: websocket-passthrough
          uri: ws://jira-issue-service:8084
          predicates:
            - Path=/ws/**

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

jwt:
  secret: ${JWT_SECRET:jira-platform-super-secret-key-that-is-at-least-256-bits-long}

management:
  health:
    redis:
      enabled: ${REDIS_ENABLED:false}