spring:
  config:
    activate:
      on-profile: docker
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "${CORS_ALLOWED_ORIGINS:http://localhost:3000}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            maxAge: 3600
      routes:
        # Auth Service (frontend uses /api/auth/*)
        - id: auth-service-api
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/auth/**

        # User Service
        - id: user-service
          uri: http://user-service:8082
          predicates:
            - Path=/users/**

        # Project Service (controllers use /api/projects and /api/templates paths)
        - id: project-service
          uri: http://project-service:8083
          predicates:
            - Path=/api/projects/**

        - id: templates-api
          uri: http://project-service:8083
          predicates:
            - Path=/api/templates/**

        - id: security-levels-api
          uri: http://project-service:8083
          predicates:
            - Path=/api/security-levels/**

        - id: screen-schemes-api
          uri: http://project-service:8083
          predicates:
            - Path=/api/screen-schemes/**

        # Issue Service
        - id: issue-service
          uri: http://issue-service:8084
          predicates:
            - Path=/api/issues/**

        # Version Service
        - id: version-service
          uri: http://version-service:8096
          predicates:
            - Path=/versions/**
          filters:
            - RewritePath=/versions(?<path>/?.*), /api/versions$\{path}
        - id: version-service-api
          uri: http://version-service:8096
          predicates:
            - Path=/api/versions/**

        # Component Service
        - id: component-service
          uri: http://component-service:8097
          predicates:
            - Path=/components/**
          filters:
            - RewritePath=/components(?<path>/?.*), /api/components$\{path}
        - id: component-service-api
          uri: http://component-service:8097
          predicates:
            - Path=/api/components/**

        # Workflow Service
        - id: workflow-service
          uri: http://workflow-service:8085
          predicates:
            - Path=/workflows/**
        - id: workflow-script-service
          uri: http://workflow-service:8085
          predicates:
            - Path=/api/workflow/scripts/**

        # Sprint Service
        - id: sprint-service
          uri: http://sprint-service:8091
          predicates:
            - Path=/api/sprints/**

        - id: sprint-service-root
          uri: http://sprint-service:8091
          predicates:
            - Path=/sprints/**
          filters:
            - StripPrefix=1

        # Board Service
        - id: board-service
          uri: http://sprint-service:8091
          predicates:
            - Path=/api/boards/**

        - id: board-service-root
          uri: http://sprint-service:8091
          predicates:
            - Path=/boards/**
          filters:
            - StripPrefix=1

        # Plan Service
        - id: plan-service
          uri: http://plan-service:8092
          predicates:
            - Path=/api/plans/**

        - id: plan-service-root
          uri: http://plan-service:8092
          predicates:
            - Path=/plans/**
          filters:
            - StripPrefix=1

        # Program Service
        - id: program-service
          uri: http://plan-service:8092
          predicates:
            - Path=/api/programs/**
          filters:
            - StripPrefix=1

        - id: program-service-root
          uri: http://plan-service:8092
          predicates:
            - Path=/programs/**
          filters:
            - StripPrefix=1

        # Migration Service
        # Migration controllers use /api/migration/* paths — do not strip prefix
        - id: migration-service
          uri: http://migration-service:8094
          predicates:
            - Path=/api/migration/**

        # User Service - Jira CWD admin API (frontend uses /user-service/rest/admin/1.0/*)
        - id: user-service-admin
          uri: http://user-service:8082
          predicates:
            - Path=/user-service/**
          filters:
            - StripPrefix=1

        # Admin Service
        - id: admin-service
          uri: http://admin-service:8093
          predicates:
            - Path=/admin/**
          filters:
            - RewritePath=/admin(?<path>/?.*), /api/admin${path}

        - id: admin-api
          uri: http://admin-service:8093
          predicates:
            - Path=/api/admin/**

        # Fields Service
        - id: fields-api
          uri: http://admin-service:8093
          predicates:
            - Path=/api/fields/**
          filters:
            - StripPrefix=1

        # Comment Service
        - id: comment-service
          uri: http://comment-service:8086
          predicates:
            - Path=/comments/**
          filters:
            - RewritePath=/comments(?<segment>/?.*), /api/comments$\{segment}
        - id: comment-service-api
          uri: http://comment-service:8086
          predicates:
            - Path=/api/comments/**

        # Test Service
        - id: test-service
          uri: http://test-service:8095
          predicates:
            - Path=/api/tests/**
        - id: test-set-service
          uri: http://test-service:8095
          predicates:
            - Path=/api/test-sets/**
        - id: test-plan-service
          uri: http://test-service:8095
          predicates:
            - Path=/api/test-plans/**
        - id: test-execution-service
          uri: http://test-service:8095
          predicates:
            - Path=/api/test-executions/**
        - id: test-environment-service
          uri: http://test-service:8095
          predicates:
            - Path=/api/test-environments/**
        - id: test-workflow-service
          uri: http://test-service:8095
          predicates:
            - Path=/api/test-workflows/**
        - id: test-folder-service
          uri: http://test-service:8095
          predicates:
            - Path=/api/test-folders/**
        - id: test-run-service
          uri: http://test-service:8095
          predicates:
            - Path=/api/test-runs/**
        # SYSDOPS Aircraft Design - routed to test-service
        - id: vvo-service
          uri: http://test-service:8095
          predicates:
            - Path=/api/vvo/**
        - id: hlvvo-service
          uri: http://test-service:8095
          predicates:
            - Path=/api/hlvvo/**
        - id: tech-event-service
          uri: http://test-service:8095
          predicates:
            - Path=/api/tech-events/**
        - id: bench-defect-service
          uri: http://test-service:8095
          predicates:
            - Path=/api/bench-defects/**
        - id: problem-report-service
          uri: http://test-service:8095
          predicates:
            - Path=/api/problem-reports/**
        - id: vv-report-service
          uri: http://test-service:8095
          predicates:
            - Path=/api/vv-reports/**
        - id: campaign-service
          uri: http://test-service:8095
          predicates:
            - Path=/api/campaigns/**
        - id: export-template-service
          uri: http://test-service:8095
          predicates:
            - Path=/api/export-templates/**
        - id: test-request-service
          uri: http://test-service:8095
          predicates:
            - Path=/api/test-requests/**

        # Notification Service
        - id: notification-service
          uri: http://notification-service:8087
          predicates:
            - Path=/notifications/**

        # Search Service
        - id: search-service
          uri: http://search-service:8088
          predicates:
            - Path=/search/**

        # Audit Service
        - id: audit-service
          uri: http://audit-service:8089
          predicates:
            - Path=/audit/**

        - id: audit-api
          uri: http://audit-service:8089
          predicates:
            - Path=/api/audit/**
          filters:
            - StripPrefix=1

        # Attachment Service
        - id: attachment-service
          uri: http://attachment-service:8090
          predicates:
            - Path=/attachments/**
          filters:
            - RewritePath=/attachments(?<segment>/?.*), /api/attachments$\{segment}
        - id: attachment-service-api
          uri: http://attachment-service:8090
          predicates:
            - Path=/api/attachments/**

        # WebSocket
        - id: issue-websocket
          uri: ws://issue-service:8084
          predicates:
            - Path=/ws/issues/**

        - id: websocket-passthrough
          uri: ws://issue-service:8084
          predicates:
            - Path=/ws/**

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

jwt:
  secret: ${JWT_SECRET:jira-platform-super-secret-key-that-is-at-least-256-bits-long}

management:
  health:
    redis:
      enabled: ${REDIS_ENABLED:false}