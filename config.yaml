# =============================================================================
# Avionics Systems Platform - Centralized Configuration
# =============================================================================
# This file is the single source of truth for all service ports, database
# credentials, security settings, and startup options.
# All launcher scripts read from this file — DO NOT hardcode values elsewhere.
#
# Usage:
#   python launcher.py        - reads this file automatically
#   .\start-platform.ps1         - reads this file automatically
#   docker-compose up         - uses environment variables set from this file
#
# To override any value, set the corresponding environment variable:
#   export AVIONICS_SYSTEMS_DB_PASSWORD=secret   (Unix)
#   $env:AVIONICS_SYSTEMS_DB_PASSWORD="secret"   (PowerShell)
# =============================================================================

version: "1.0"

# ---------------------------------------------------------------------------
# DATABASE
# ---------------------------------------------------------------------------
database:
  host: "localhost"
  port: 5432
  username: "avionicsadmin"
  password: "UNIpay@123"

  # Multi-database setup — comma-separated list of database names
  # PostgreSQL container will initialize all of these on first start
  databases:
    - "auth_db"
    - "user_db"
    - "project_db"
    - "issue_db"
    - "workflow_db"
    - "comment_db"
    - "notification_db"
    - "search_db"
    - "audit_db"
    - "attachment_db"
    - "sprint_db"
    - "plan_db"
    - "migration_db"

  # Docker container settings
  docker:
    image: "postgres:16-alpine"
    container_name: "avionics-systems-postgres"
    data_volume: "avionics-systems-postgres-data"

# ---------------------------------------------------------------------------
# SECURITY
# ---------------------------------------------------------------------------
security:
  # JWT secret — must be at least 256 bits (32+ characters)
  jwt_secret: "avionics-systems-platform-super-secret-key-that-is-at-least-256-bits-long"

# ---------------------------------------------------------------------------
# SERVICES
# ---------------------------------------------------------------------------
# Each service defines:
#   port       — the port it listens on
#   dir        — the directory name under the platform root
#   jar        — the built JAR filename (relative to dir/target/)
#   health     — HTTP path to check for readiness (default: /actuator/health)
#   deps       — services that must be healthy before this starts
#
# STARTUP ORDER is auto-computed from the 'deps' graph (topological sort).
# Services with the same dependency level start in parallel.
# ---------------------------------------------------------------------------
services:
  auth:
    port: 8081
    dir: "avionics-systems-auth-service"
    jar: "avionics-systems-auth-service-1.0.0.jar"
    health: "/actuator/health"
    deps: []

  gateway:
    port: 8080
    dir: "avionics-systems-gateway"
    jar: "avionics-systems-gateway-1.0.0.jar"
    health: "/actuator/health"
    deps: ["auth"]

  user:
    port: 8082
    dir: "avionics-systems-user-service"
    jar: "avionics-systems-user-service-1.0.0.jar"
    health: "/actuator/health"
    deps: ["auth"]

  project:
    port: 8083
    dir: "avionics-systems-project-service"
    jar: "avionics-systems-project-service-1.0.0.jar"
    health: "/actuator/health"
    deps: ["auth"]

  issue:
    port: 8084
    dir: "avionics-systems-issue-service"
    jar: "avionics-systems-issue-service-1.0.0.jar"
    health: "/actuator/health"
    deps: ["auth"]

  workflow:
    port: 8085
    dir: "avionics-systems-workflow-service"
    jar: "avionics-systems-workflow-service-1.0.0.jar"
    health: "/actuator/health"
    health_timeout: 240
    deps: ["auth"]

  comment:
    port: 8086
    dir: "avionics-systems-comment-service"
    jar: "avionics-systems-comment-service-1.0.0.jar"
    health: "/actuator/health"
    deps: ["auth"]

  notification:
    port: 8087
    dir: "avionics-systems-notification-service"
    jar: "avionics-systems-notification-service-1.0.0.jar"
    health: "/actuator/health"
    deps: ["auth"]

  search:
    port: 8088
    dir: "avionics-systems-search-service"
    jar: "avionics-systems-search-service-1.0.0.jar"
    health: "/actuator/health"
    deps: ["auth"]

  audit:
    port: 8089
    dir: "avionics-systems-audit-service"
    jar: "avionics-systems-audit-service-1.0.0.jar"
    health: "/actuator/health"
    deps: ["auth"]

  attachment:
    port: 8090
    dir: "avionics-systems-attachment-service"
    jar: "avionics-systems-attachment-service-1.0.0.jar"
    health: "/actuator/health"
    deps: ["auth"]

  sprint:
    port: 8091
    dir: "avionics-systems-sprint-service"
    jar: "avionics-systems-sprint-service-1.0.0.jar"
    health: "/actuator/health"
    health_timeout: 240
    deps: ["auth"]

  plan:
    port: 8092
    dir: "avionics-systems-plan-service"
    jar: "avionics-systems-plan-service-1.0.0.jar"
    health: "/actuator/health"
    deps: ["auth"]

  admin:
    port: 8093
    dir: "avionics-systems-admin-service"
    jar: "avionics-systems-admin-service-1.0.0.jar"
    health: "/actuator/health"
    deps: ["auth"]

  migration:
    port: 8094
    dir: "avionics-systems-migration-service"
    jar: "avionics-systems-migration-service-1.0.0.jar"
    health: "/actuator/health"
    health_timeout: 300
    deps: ["auth"]

  test:
    port: 8095
    dir: "avionics-systems-test-service"
    jar: "avionics-systems-test-service-1.0.0.jar"
    health: "/actuator/health"
    deps: ["auth"]

# ---------------------------------------------------------------------------
# FRONTEND
# ---------------------------------------------------------------------------
frontend:
  port: 3000
  dir: "avionics-systems-frontend"
  open_browser: true

# ---------------------------------------------------------------------------
# STARTUP BEHAVIOUR
# ---------------------------------------------------------------------------
startup:
  # Build JARs automatically if they don't exist
  build_if_missing: true

  # Maven command for building (-q quiet; launcher adds -T 1C when maven_parallel is true)
  maven_flags: "-Dmaven.test.skip=true -q"
  maven_parallel: true
  max_parallel_builds: 4

  # Health check settings
  health_check_path: "/actuator/health"
  health_timeout: 180       # seconds to wait per service (heavy JVMs need more time)
  health_poll_interval: 2   # seconds between health checks
  max_parallel: 3           # max JVMs started at once (prevents OOM on 16GB machines)
  protected_ports: [5432]   # never kill processes on these ports (PostgreSQL)

  # Process management
  shutdown_timeout: 15       # seconds to wait before force-kill
  max_restart_attempts: 3    # per service; stops infinite restart loops
  restart_cooldown_seconds: 30

  # Logging
  log_dir: "logs"

  # Whether to clean up existing processes on our ports at startup
  cleanup_on_start: true

  # JVM options for all Java services
  java_opts: "-Xms128m -Xmx384m -XX:+UseG1GC"

# ---------------------------------------------------------------------------
# PORTS (for reference — actual values come from services.*.port above)
# ---------------------------------------------------------------------------
# PostgreSQL : 5432
# Gateway    : 8080
# Auth       : 8081
# User       : 8082
# Project    : 8083
# Issue      : 8084
# Workflow   : 8085
# Comment    : 8086
# Notify     : 8087
# Search     : 8088
# Audit      : 8089
# Attachment  : 8090
# Sprint     : 8091
# Plan       : 8092
# Admin      : 8093
# Migration  : 8094
# Test       : 8095
# Frontend   : 3000
