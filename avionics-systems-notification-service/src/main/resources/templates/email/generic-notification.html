<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${subject}">Notification</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: #0052CC; color: white; padding: 20px; border-radius: 4px 4px 0 0; }
        .header h1 { margin: 0; font-size: 18px; }
        .content { background: #f4f5f7; padding: 20px; border-radius: 0 0 4px 4px; }
        .issue-key { background: #deebff; color: #0052CC; padding: 4px 8px; border-radius: 3px; font-weight: bold; text-decoration: none; }
        .details { background: white; padding: 15px; border-radius: 4px; margin: 15px 0; }
        .details p { margin: 8px 0; }
        .label { color: #6b778c; font-size: 12px; }
        .footer { text-align: center; padding: 20px; color: #6b778c; font-size: 12px; }
    </style>
</head>
<body>
    <div class="header">
        <h1 th:text="${title}">Notification</h1>
    </div>
    <div class="content">
        <p>Hello,</p>
        <div class="details">
            <p th:if="${issueKey}"><span class="label">Issue:</span> <span class="issue-key" th:text="${issueKey}">PROJ-123</span></p>
            <p th:if="${projectKey}"><span class="label">Project:</span> <span th:text="${projectKey}">PROJECT</span></p>
            <p th:text="${message}">Notification details will appear here.</p>
        </div>
        <p>Best regards,<br>Avionics Systems</p>
    </div>
    <div class="footer">
        <p>This is an automated notification from Avionics Systems.</p>
    </div>
</body>
</html>
