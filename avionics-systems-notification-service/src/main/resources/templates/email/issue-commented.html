<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${subject}">New Comment</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: #0052CC; color: white; padding: 20px; border-radius: 4px 4px 0 0; }
        .header h1 { margin: 0; font-size: 18px; }
        .content { background: #f4f5f7; padding: 20px; border-radius: 0 0 4px 4px; }
        .issue-key { background: #deebff; color: #0052CC; padding: 4px 8px; border-radius: 3px; font-weight: bold; text-decoration: none; }
        .comment-preview { background: white; padding: 15px; border-radius: 4px; margin: 15px 0; border-left: 4px solid #0052CC; }
        .comment-preview p { margin: 0; white-space: pre-wrap; }
        .footer { text-align: center; padding: 20px; color: #6b778c; font-size: 12px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>New Comment on Your Issue</h1>
    </div>
    <div class="content">
        <p>Hello,</p>
        <p th:text="${commenter}">User</p> has added a comment to an issue you're watching:

        <div class="details">
            <p><span class="label">Project:</span> <span th:text="${projectKey}">PROJECT</span></p>
            <p><span class="label">Issue:</span> <a href="#" class="issue-key" th:text="${issueKey}">PROJ-123</a></p>
        </div>

        <div class="comment-preview">
            <p th:text="${commentPreview}">Comment preview text...</p>
        </div>

        <p><a href="#">View full comment</a></p>
        <p>Best regards,<br>Avionics Systems</p>
    </div>
    <div class="footer">
        <p>This is an automated notification from Avionics Systems.</p>
    </div>
</body>
</html>
