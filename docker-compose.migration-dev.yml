# Minimal stack for migration-service dev/UI test (9 containers, not full ~20).
# Uses pre-built images from ghcr.io/ms86100
# Usage:
#   docker compose -f docker-compose.migration-dev.yml down
#   docker compose -f docker-compose.migration-dev.yml up -d
# Reset migration Flyway only: docker exec avionics-systems-postgres psql -U avionicsadmin -d avionics_systems_platform -c "DROP SCHEMA IF EXISTS jira_migration CASCADE;"
# UI: http://localhost:3000  login ms86100 / admin123  → Migration Center
# API smoke: http://localhost:3000/api/migration/templates  or  http://localhost:8094/actuator/health

name: avionics-systems-migration-dev

networks:
  avionics-systems-network:
    driver: bridge

volumes:
  postgres_migration_dev_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: avionics-systems-postgres
    environment:
      POSTGRES_USER: avionicsadmin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-avionicspass}
      POSTGRES_DB: avionics_systems_platform
    volumes:
      - postgres_migration_dev_data:/var/lib/postgresql/data
      - ./postgres/init/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    ports:
      - "5432:5432"
    networks:
      - avionics-systems-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avionicsadmin"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    image: ghcr.io/ms86100/avionics-systems-auth-service:latest
    container_name: avionics-systems-auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: avionics_systems_platform
      DB_USERNAME: avionicsadmin
      DB_PASSWORD: ${DB_PASSWORD:-avionicspass}
      JAVA_OPTS: -Xms128m -Xmx384m
      JWT_SECRET: avionics-systems-platform-super-secret-key-that-is-at-least-256-bits-long
      JWT_EXPIRATION_MS: 86400000
      JWT_REFRESH_EXPIRATION_MS: 604800000
    networks:
      - avionics-systems-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  user-service:
    image: ghcr.io/ms86100/avionics-systems-user-service:latest
    container_name: avionics-systems-user-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: avionics_systems_platform
      DB_USERNAME: avionicsadmin
      DB_PASSWORD: ${DB_PASSWORD:-avionicspass}
      JAVA_OPTS: -Xms128m -Xmx384m
    networks:
      - avionics-systems-network
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  project-service:
    image: ghcr.io/ms86100/avionics-systems-project-service:latest
    container_name: avionics-systems-project-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: avionics_systems_platform
      DB_USERNAME: avionicsadmin
      DB_PASSWORD: ${DB_PASSWORD:-avionicspass}
      JAVA_OPTS: -Xms128m -Xmx384m
    networks:
      - avionics-systems-network
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      issue-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  workflow-service:
    image: ghcr.io/ms86100/avionics-systems-workflow-service:latest
    container_name: avionics-systems-workflow-service
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: avionics_systems_platform
      DB_USERNAME: avionicsadmin
      DB_PASSWORD: ${DB_PASSWORD:-avionicspass}
      JAVA_OPTS: -Xms128m -Xmx384m
    networks:
      - avionics-systems-network
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  issue-service:
    image: ghcr.io/ms86100/avionics-systems-issue-service:latest
    container_name: avionics-systems-issue-service
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: avionics_systems_platform
      DB_USERNAME: avionicsadmin
      DB_PASSWORD: ${DB_PASSWORD:-avionicspass}
      JAVA_OPTS: -Xms128m -Xmx384m
      WORKFLOW_SERVICE_URL: http://workflow-service:8085
      PROJECT_SERVICE_URL: http://project-service:8083
    networks:
      - avionics-systems-network
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      workflow-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 120s

  gateway:
    image: ghcr.io/ms86100/avionics-systems-gateway:latest
    container_name: avionics-systems-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: -Xms128m -Xmx384m
    networks:
      - avionics-systems-network
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      project-service:
        condition: service_healthy
      issue-service:
        condition: service_healthy

  migration-service:
    image: ghcr.io/ms86100/avionics-systems-migration-service:latest
    container_name: avionics-systems-migration-service
    ports:
      - "8094:8094"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: avionics_systems_platform
      DB_USERNAME: avionicsadmin
      DB_PASSWORD: ${DB_PASSWORD:-avionicspass}
      JAVA_OPTS: -Xms128m -Xmx512m
    networks:
      - avionics-systems-network
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      project-service:
        condition: service_healthy
      issue-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8094/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 120s

  frontend:
    image: ghcr.io/ms86100/avionics-systems-frontend:latest
    container_name: avionics-systems-frontend
    ports:
      - "3000:3000"
    networks:
      - avionics-systems-network
    depends_on:
      gateway:
        condition: service_started
