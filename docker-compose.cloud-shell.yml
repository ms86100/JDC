# =============================================================================
# Cloud Shell Optimized - Uses pre-built images from GitHub Container Registry
# Build once locally, run everywhere without rebuilding
# =============================================================================

networks:
  jira-network:
    driver: bridge

volumes:
  postgres_data: {}
  attachment_data: {}

services:
  postgres:
    image: postgres:16-alpine
    container_name: jira-postgres
    environment:
      POSTGRES_USER: jiraadmin
      POSTGRES_PASSWORD: jirapass123
      POSTGRES_DB: jira_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"
    networks:
      - jira-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jiraadmin -d jira_platform"]
      interval: 10s
      timeout: 5s
      retries: 10

  migration-service:
    image: ghcr.io/ms86100/jira-migration-service:latest
    container_name: jira-migration-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: jira_platform
      DB_USERNAME: jiraadmin
      DB_PASSWORD: jirapass123
    networks:
      - jira-network
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: jira-redis
    ports:
      - "6379:6379"
    networks:
      - jira-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: jira-zipkin
    ports:
      - "9411:9411"
    networks:
      - jira-network

  gateway:
    image: ghcr.io/ms86100/jira-gateway:latest
    container_name: jira-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JAVA_OPTS: -Xms256m -Xmx512m
    networks:
      - jira-network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  auth-service:
    image: ghcr.io/ms86100/jira-auth-service:latest
    container_name: jira-auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: jira_platform
      DB_USERNAME: jiraadmin
      DB_PASSWORD: jirapass123
      JWT_SECRET: jira-platform-super-secret-key-that-is-at-least-256-bits-long
    networks:
      - jira-network
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    image: ghcr.io/ms86100/jira-user-service:latest
    container_name: jira-user-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: jira_platform
      DB_USERNAME: jiraadmin
      DB_PASSWORD: jirapass123
      AUTH_SERVICE_URL: http://auth-service:8081
    networks:
      - jira-network
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started

  project-service:
