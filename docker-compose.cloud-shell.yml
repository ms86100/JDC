# =============================================================================
# Cloud Shell Optimized - Uses pre-built images from GitHub Container Registry
# Build once locally, run everywhere without rebuilding
# =============================================================================

networks:
  avionics-systems-network:
    driver: bridge

volumes:
  postgres_data: {}
  attachment_data: {}

services:
  postgres:
    image: postgres:16-alpine
    container_name: avionics-systems-postgres
    environment:
      POSTGRES_USER: avionicsadmin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-avionicspass}
      POSTGRES_DB: avionics_systems_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"
    networks:
      - avionics-systems-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avionicsadmin -d avionics_systems_platform"]
      interval: 10s
      timeout: 5s
      retries: 10

  migration-service:
    image: ghcr.io/ms86100/avionics-systems-migration-service:latest
    container_name: avionics-systems-migration-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: avionics_systems_platform
      DB_USERNAME: avionicsadmin
      DB_PASSWORD: ${DB_PASSWORD:-avionicspass}
    networks:
      - avionics-systems-network
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: avionics-systems-redis
    ports:
      - "6379:6379"
    networks:
      - avionics-systems-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: avionics-systems-zipkin
    ports:
      - "9411:9411"
    networks:
      - avionics-systems-network

  gateway:
    image: ghcr.io/ms86100/avionics-systems-gateway:latest
    container_name: avionics-systems-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JAVA_OPTS: -Xms256m -Xmx512m
    networks:
      - avionics-systems-network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  auth-service:
    image: ghcr.io/ms86100/avionics-systems-auth-service:latest
    container_name: avionics-systems-auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: avionics_systems_platform
      DB_USERNAME: avionicsadmin
      DB_PASSWORD: ${DB_PASSWORD:-avionicspass}
      JWT_SECRET: avionics-systems-platform-super-secret-key-that-is-at-least-256-bits-long
    networks:
      - avionics-systems-network
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    image: ghcr.io/ms86100/avionics-systems-user-service:latest
    container_name: avionics-systems-user-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: avionics_systems_platform
      DB_USERNAME: avionicsadmin
      DB_PASSWORD: ${DB_PASSWORD:-avionicspass}
      AUTH_SERVICE_URL: http://auth-service:8081
    networks:
      - avionics-systems-network
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started

  project-service:
