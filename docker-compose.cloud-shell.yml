services:
  postgres:
    image: postgres:16-alpine
    container_name: jira-postgres
    environment:
      POSTGRES_USER: jiraadmin
      POSTGRES_PASSWORD: jirapass123
      POSTGRES_DB: jira_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init/00-init-schema.sql:/docker-entrypoint-initdb.d/init-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jiraadmin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jira-network

  gateway:
    image: ghcr.io/ms86100/jira-gateway:latest
    container_name: jira-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: cloudshell
      REDIS_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jira-network

  auth-service:
    image: ghcr.io/ms86100/jira-auth-service:latest
    container_name: jira-auth-service
    environment:
      SPRING_PROFILES_ACTIVE: cloudshell
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: jira_platform
      DB_USERNAME: jiraadmin
      DB_PASSWORD: jirapass123
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jira-network

  user-service:
    image: ghcr.io/ms86100/jira-user-service:latest
    container_name: jira-user-service
    environment:
      SPRING_PROFILES_ACTIVE: cloudshell
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: jira_platform
      DB_USERNAME: jiraadmin
      DB_PASSWORD: jirapass123
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - jira-network

