services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jiraadmin
      POSTGRES_PASSWORD: jirapass123
      POSTGRES_DB: jira_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  gateway:
    image: ghcr.io/ms86100/jira-gateway:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: cloudshell
      REDIS_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    image: ghcr.io/ms86100/jira-auth-service:latest
    environment:
      SPRING_PROFILES_ACTIVE: cloudshell
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: jira_platform
      DB_USERNAME: jiraadmin
      DB_PASSWORD: jirapass123
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    image: ghcr.io/ms86100/jira-user-service:latest
    environment:
      SPRING_PROFILES_ACTIVE: cloudshell
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      - postgres

  project-service:
    image: ghcr.io/ms86100/jira-project-service:latest
    environment:
      SPRING_PROFILES_ACTIVE: cloudshell
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      - postgres

  issue-service:
    image: ghcr.io/ms86100/jira-issue-service:latest
    environment:
      SPRING_PROFILES_ACTIVE: cloudshell
      DB_HOST: postgres
    depends_on:
      - postgres

  frontend:
    image: ghcr.io/ms86100/jira-frontend:latest
    ports:
      - "3000:3000"
    environment:
      VITE_API_GATEWAY_URL: http://localhost:8080
      VITE_ENV: cloudshell
    depends_on:
      - gateway

volumes:
  postgres_data:
