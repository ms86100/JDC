server:
  port: 8085

spring:
  main:
    allow-circular-references: true
  application:
    name: jira-workflow-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jira_platform}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: jira_workflow
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: '0'
    validate-on-migrate: true
    schemas: jira_workflow
    default-schema: jira_workflow
    table: flyway_schema_history

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

jira:
  services:
    issue-url: ${ISSUE_SERVICE_URL:http://jira-issue-service:8084}
    test-url: ${TEST_SERVICE_URL:http://jira-test-service:8095}
    comment-url: ${COMMENT_SERVICE_URL:http://jira-comment-service:8086}
    attachment-url: ${ATTACHMENT_SERVICE_URL:http://jira-attachment-service:8090}
    admin-url: ${ADMIN_SERVICE_URL:http://jira-admin-service:8093}
    user-url: ${USER_SERVICE_URL:http://jira-user-service:8082}
    notification-url: ${NOTIFICATION_SERVICE_URL:http://jira-notification-service:8087}
    search-url: ${SEARCH_SERVICE_URL:http://jira-search-service:8088}
    project-url: ${PROJECT_SERVICE_URL:http://jira-project-service:8083}
    version-url: ${VERSION_SERVICE_URL:http://jira-version-service:8096}
    component-url: ${COMPONENT_SERVICE_URL:http://jira-component-service:8097}
    sprint-url: ${SPRINT_SERVICE_URL:http://jira-sprint-service:8091}
  workflow:
    transition-fallback: false
    outbox:
      batch-size: 50
      poll-interval-ms: 5000
  scripting:
    enabled: true
    timeout-ms: 5000
    memory-limit-mb: 64
    max-statements: 500000
    console-timeout-ms: 10000
    log-retention-days: 30
    http-whitelist-domains: []
    http-timeout-ms: 5000
    env-whitelist-keys: []
    scheduled-enabled: false
    sql-write-enabled: false
    scheduled-poll-interval-ms: 30000

logging:
  level:
    com.jira: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  file:
    path: ${LOG_PATH:../../logs}/workflow
