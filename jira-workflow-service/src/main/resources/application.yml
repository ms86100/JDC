server:
  port: 8085

spring:
  main:
    allow-circular-references: true
  application:
    name: jira-workflow-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jira_platform}
    username: ${DB_USERNAME:jiraadmin}
    password: ${DB_PASSWORD:UNIpay@123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: jira_workflow
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: '0'
    validate-on-migrate: true
    schemas: jira_workflow
    default-schema: jira_workflow
    table: flyway_schema_history

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

jira:
  services:
    issue-url: ${ISSUE_SERVICE_URL:http://localhost:8084}
    admin-url: ${ADMIN_SERVICE_URL:http://localhost:8093}
    user-url: ${USER_SERVICE_URL:http://localhost:8082}
    notification-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
    search-url: ${SEARCH_SERVICE_URL:http://localhost:8088}
    project-url: ${PROJECT_SERVICE_URL:http://localhost:8083}
  workflow:
    outbox:
      batch-size: 50
      poll-interval-ms: 5000

logging:
  level:
    com.jira: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
