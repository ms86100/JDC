server:
  port: 8085

spring:
  main:
    allow-circular-references: true
  application:
    name: jira-workflow-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jira_platform}
    username: ${DB_USERNAME:jiraadmin}
    password: ${DB_PASSWORD:jirapass123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: jira_workflow
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: '0'
    validate-on-migrate: true
    schemas: jira_workflow
    default-schema: jira_workflow
    table: flyway_schema_history

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

jira:
  services:
    issue-url: ${ISSUE_SERVICE_URL:http://${DB_HOST:-postgres}:${DB_PORT:-5432}}
    comment-url: ${COMMENT_SERVICE_URL:http://${DB_HOST:-postgres}:${DB_PORT:-5432}}
    attachment-url: ${ATTACHMENT_SERVICE_URL:http://${DB_HOST:-postgres}:${DB_PORT:-5432}}
    admin-url: ${ADMIN_SERVICE_URL:http://${DB_HOST:-postgres}:${DB_PORT:-5432}}
    user-url: ${USER_SERVICE_URL:http://${DB_HOST:-postgres}:${DB_PORT:-5432}}
    notification-url: ${NOTIFICATION_SERVICE_URL:http://${DB_HOST:-postgres}:${DB_PORT:-5432}}
    search-url: ${SEARCH_SERVICE_URL:http://${DB_HOST:-postgres}:${DB_PORT:-5432}}
    project-url: ${PROJECT_SERVICE_URL:http://${DB_HOST:-postgres}:${DB_PORT:-5432}}
  workflow:
    transition-fallback: false
    outbox:
      batch-size: 50
      poll-interval-ms: 5000

logging:
  level:
    com.jira: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  file:
    path: ${LOG_PATH:../../logs}/workflow
