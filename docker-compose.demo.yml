networks:
  avionics-systems-network:
    driver: bridge

volumes:
  postgres_data: {}

services:
  postgres:
    image: postgres:16-alpine
    container_name: avionics-systems-postgres
    environment:
      POSTGRES_USER: avionicsadmin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-avionicspass}
      POSTGRES_DB: avionics_systems_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - avionics-systems-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avionicsadmin -d avionics_systems_platform"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: avionics-systems-redis
    ports:
      - "6379:6379"
    networks:
      - avionics-systems-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  gateway:
    image: ghcr.io/ms86100/avionics-systems-gateway:latest
    container_name: avionics-systems-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: avionics-systems-platform-super-secret-key-that-is-at-least-256-bits-long
    networks:
      - avionics-systems-network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  auth-service:
    image: ghcr.io/ms86100/avionics-systems-auth-service:latest
    container_name: avionics-systems-auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: avionics_systems_platform
      DB_USERNAME: avionicsadmin
      DB_PASSWORD: ${DB_PASSWORD:-avionicspass}
      JWT_SECRET: avionics-systems-platform-super-secret-key-that-is-at-least-256-bits-long
    networks:
      - avionics-systems-network
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ghcr.io/ms86100/avionics-systems-frontend:latest
    container_name: avionics-systems-frontend
    ports:
      - "3000:3000"
    networks:
      - avionics-systems-network
    depends_on:
      gateway:
        condition: service_started

  project-service:
    image: ghcr.io/ms86100/avionics-systems-project-service:latest
    container_name: avionics-systems-project-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: avionics_systems_platform
      DB_USERNAME: avionicsadmin
      DB_PASSWORD: ${DB_PASSWORD:-avionicspass}
      JWT_SECRET: avionics-systems-platform-super-secret-key-that-is-at-least-256-bits-long
    networks:
      - avionics-systems-network
    depends_on:
      postgres:
        condition: service_healthy

  issue-service:
    image: ghcr.io/ms86100/avionics-systems-issue-service:latest
    container_name: avionics-systems-issue-service
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: avionics_systems_platform
      DB_USERNAME: avionicsadmin
      DB_PASSWORD: ${DB_PASSWORD:-avionicspass}
      JWT_SECRET: avionics-systems-platform-super-secret-key-that-is-at-least-256-bits-long
      EUREKA_CLIENT_ENABLED: "false"
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE-ON-MIGRATE: "true"
      SPRING_FLYWAY_DEFAULT_SCHEMA: "jira_issue"
      SPRING_FLYWAY_SCHEMAS: "jira_issue"
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: "jira_issue"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "localhost:9092"
      SPRING_DATA_REDIS_HOST: "redis"
    networks:
      - avionics-systems-network
    depends_on:
      postgres:
        condition: service_healthy