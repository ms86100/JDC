server:
  port: 8092
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
  tomcat:
    threads:
      max: 200
      min-spare: 20
    max-connections: 8192
    accept-count: 100

spring:
  application:
    name: jira-plan-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jira_platform}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 30000

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: jira_plan
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 500
        generate_statistics: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    default-schema: jira_plan
    schemas: jira_plan
    create-schemas: true
    validate-on-migrate: true

  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}

resilience4j:
  circuitbreaker:
    configs:
      default:
        failureRateThreshold: 50
        slidingWindowSize: 10
        waitDurationInOpenState: 30s
        minimumNumberOfCalls: 5
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  sprint:
    state:
      future: FUTURE
      active: ACTIVE
      closed: CLOSED
      abandoned: ABANDONED
    completion-status:
      uncompleted: UNCOMPLETED
      completed: COMPLETED
      incomplete: INCOMPLETE
      dropped: DROPPED
      in-progress: IN_PROGRESS
    default-rank: "0|hzzzzz:"
  release:
    status:
      draft: DRAFT
      approved: APPROVED
      released: RELEASED
  goal:
    status:
      not-started: NOT_STARTED
      in-progress: IN_PROGRESS
      completed: COMPLETED
  backlog:
    default-status: BACKLOG
  board:
    default-type: SCRUM
    default-column-config-mode: DEFAULT
    default-card-layout-mode: COMPACT
    default-swimlane: NONE
    default-field-type: STANDARD
    column:
      default-min-width: 100
      default-max-width: 600
  critical-path:
    default-duration-days: 5
    risk:
      high-threshold: 0.7
      medium-threshold: 0.3
      large-delay-days: 5
      recommendation:
        buffer: "Consider adding buffer time to downstream critical path items"
        scope: "Evaluate whether scope reduction is possible"
        notify: "Large delay detected - notify stakeholders"
        contained: "Change does not affect critical path - impact is contained"
  schedule:
    default-duration-days: 5
    target-date-duration-days: 7
  working-days:
    default-name: Default
    default-hours-per-day: "8.00"
    default-working-days: MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY
  dependency:
    default-type: BLOCKS
    impact:
      high-threshold: 60
      medium-threshold: 30
  program:
    default-access-type: OPEN
  team:
    default-capacity-hours: "40.00"

logging:
  level:
    com.jira.plan: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  file:
    path: ${LOG_PATH:../../logs}/plan
