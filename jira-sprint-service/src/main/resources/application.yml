spring:
  application:
    name: jira-sprint-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jira_platform}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 20000
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: jira_sprint
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 500
        generate_statistics: false
  flyway:
    enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8091
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
  tomcat:
    threads:
      max: 200
      min-spare: 20
    max-connections: 8192
    accept-count: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}

resilience4j:
  circuitbreaker:
    configs:
      default:
        failureRateThreshold: 50
        slidingWindowSize: 10
        waitDurationInOpenState: 30s
        minimumNumberOfCalls: 5
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  file:
    path: ${LOG_PATH:../../logs}/sprint
