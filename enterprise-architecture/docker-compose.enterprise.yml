# Enterprise Configuration
# Based on dc-app-performance-toolkit analysis

version: '3.8'

services:
  # ============ GATEWAY ============
  avionics-systems-gateway:
    build: ./avionics-systems-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=enterprise
      - EUREKA_CLIENT_ENABLED=false
      - KUBERNETES_ENABLED=true
    depends_on:
      - avionics-systems-auth
      - avionics-systems-issue
      - avionics-systems-project
    networks:
      - avionics-systems-network

  # ============ CORE SERVICES ============
  avionics-systems-auth:
    build: ./avionics-systems-auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=enterprise
      - SPRING_REDIS_HOST=avionics-systems-redis
    depends_on:
      - avionics-systems-redis
      - avionics-systems-postgres
    networks:
      - avionics-systems-network

  avionics-systems-issue:
    build: ./avionics-systems-issue-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=enterprise
      - SPRING_REDIS_HOST=avionics-systems-redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=avionics-systems-kafka:9092
    depends_on:
      - avionics-systems-redis
      - avionics-systems-postgres
      - avionics-systems-kafka
      - avionics-systems-search
    networks:
      - avionics-systems-network

  avionics-systems-project:
    build: ./avionics-systems-project-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=enterprise
    depends_on:
      - avionics-systems-postgres
    networks:
      - avionics-systems-network

  avionics-systems-workflow:
    build: ./avionics-systems-workflow-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=enterprise
    depends_on:
      - avionics-systems-postgres
      - avionics-systems-kafka
    networks:
      - avionics-systems-network

  avionics-systems-user:
    build: ./avionics-systems-user-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=enterprise
    depends_on:
      - avionics-systems-postgres
      - avionics-systems-redis
    networks:
      - avionics-systems-network

  avionics-systems-board:
    build: ./avionics-systems-sprint-service
    ports:
      - "8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=enterprise
      - SPRING_REDIS_HOST=avionics-systems-redis
    depends_on:
      - avionics-systems-redis
      - avionics-systems-postgres
      - avionics-systems-issue
    networks:
      - avionics-systems-network

  avionics-systems-search:
    build: ./avionics-systems-search-service
    ports:
      - "8087:8087"
    environment:
      - SPRING_PROFILES_ACTIVE=enterprise
      - OPENSEARCH_HOSTS=avionics-systems-opensearch:9200
    depends_on:
      - avionics-systems-opensearch
      - avionics-systems-kafka
    networks:
      - avionics-systems-network

  avionics-systems-notification:
    build: ./avionics-systems-notification-service
    ports:
      - "8088:8088"
    environment:
      - SPRING_PROFILES_ACTIVE=enterprise
    depends_on:
      - avionics-systems-kafka
    networks:
      - avionics-systems-network

  avionics-systems-audit:
    build: ./avionics-systems-audit-service
    ports:
      - "8089:8089"
    environment:
      - SPRING_PROFILES_ACTIVE=enterprise
    depends_on:
      - avionics-systems-postgres
      - avionics-systems-kafka
    networks:
      - avionics-systems-network

  avionics-systems-plan:
    build: ./avionics-systems-plan-service
    ports:
      - "8090:8090"
    environment:
      - SPRING_PROFILES_ACTIVE=enterprise
    depends_on:
      - avionics-systems-postgres
    networks:
      - avionics-systems-network

  avionics-systems-admin:
    build: ./avionics-systems-admin-service
    ports:
      - "8091:8091"
    environment:
      - SPRING_PROFILES_ACTIVE=enterprise
    depends_on:
      - avionics-systems-postgres
    networks:
      - avionics-systems-network

  # ============ DATA STORES ============
  avionics-systems-postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=avionics
      - POSTGRES_PASSWORD=avionics123
      - POSTGRES_DB=avionics_systems_enterprise
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c maintenance_work_mem=256MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
    networks:
      - avionics-systems-network

  avionics-systems-redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis-data:/data
    networks:
      - avionics-systems-network

  avionics-systems-redis-cluster:
    image: redis:7-alpine
    ports:
      - "7380-7385:7380-7385"
    command: >
      redis-server --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
    volumes:
      - redis-cluster-data:/data
    networks:
      - avionics-systems-network

  avionics-systems-opensearch:
    image: opensearchproject/opensearch:2.12.0
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - DISABLE_SECURITY_PLUGIN=true
      - cluster.name=avionics-systems-cluster
      - node.name=node-1
      - discovery.seed_hosts=opensearch-node-1,opensearch-node-2
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - avionics-systems-network

  avionics-systems-kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=avionics-systems-zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://avionics-systems-kafka:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_NUM_PARTITIONS=10
      - KAFKA_LOG_RETENTION_HOURS=168
    depends_on:
      - avionics-systems-zookeeper
    networks:
      - avionics-systems-network

  avionics-systems-zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    ports:
      - "2181:2181"
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    networks:
      - avionics-systems-network

  # ============ MONITORING ============
  prometheus:
    image: prom/prometheus:v2.47.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - avionics-systems-network

  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - avionics-systems-network

  jaeger:
    image: jaegertracing/all-in-one:1.50
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - avionics-systems-network

networks:
  avionics-systems-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  redis-cluster-data:
  opensearch-data:
  prometheus-data:
  grafana-data: