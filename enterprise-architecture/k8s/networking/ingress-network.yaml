apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: avionics-systems-platform-ingress
  namespace: avionics-systems-platform
  labels:
    app: avionics-systems-platform
    component: ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-Origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "PUT, GET, POST, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    nginx.ingress.kubernetes.io/websocket-services: "avionics-systems-gateway"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  tls:
    - hosts:
        - api.platform.local
        - platform.local
        - testmanagement.platform.local
      secretName: avionics-systems-tls-secret
  rules:
    - host: api.platform.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: avionics-systems-gateway
                port:
                  number: 80
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: avionics-systems-gateway
                port:
                  number: 80
          - path: /graphiql
            pathType: Prefix
            backend:
              service:
                name: avionics-systems-gateway
                port:
                  number: 80
    - host: platform.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: avionics-systems-gateway
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: avionics-systems-platform-network-policy
  namespace: avionics-systems-platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: avionics-systems-platform-ingress
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 8083
        - protocol: TCP
          port: 8084
        - protocol: TCP
          port: 8085
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 9092
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: avionics-systems-platform-pdb
  namespace: avionics-systems-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: avionics-systems-platform
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: avionics-systems-gateway-pdb
  namespace: avionics-systems-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: avionics-systems-gateway