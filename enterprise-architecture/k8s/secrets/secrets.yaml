apiVersion: v1
kind: Secret
metadata:
  name: jira-db-secret
  namespace: jira-platform
  labels:
    app: jira-platform
    component: database
type: Opaque
stringData:
  DB_USERNAME: "jiraadmin"
  DB_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
