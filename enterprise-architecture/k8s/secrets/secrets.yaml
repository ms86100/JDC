apiVersion: v1
kind: Secret
metadata:
  name: jira-redis-secret
  namespace: jira-platform
  labels:
    app: jira-platform
    component: cache
type: Opaque
stringData:
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
