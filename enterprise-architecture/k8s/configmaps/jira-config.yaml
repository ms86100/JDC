apiVersion: v1
kind: ConfigMap
metadata:
  name: jira-config
  namespace: jira-platform
  labels:
    app: jira-platform
    component: config
data:
  DB_HOST: "jira-postgres.jira-platform.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "jira_platform"
  DB_SCHEMA: "jira_issue"
  REDIS_HOST: "jira-redis.jira-platform.svc.cluster.local"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "jira-kafka-0.jira-kafka-headless.jira-platform.svc.cluster.local:9092,jira-kafka-1.jira-kafka-headless.jira-platform.svc.cluster.local:9092,jira-kafka-2.jira-kafka-headless.jira-platform.svc.cluster.local:9092"
  EUREKA_SERVER_URL: "http://jira-eureka.jira-platform.svc.cluster.local:8761/eureka"
  SPRING_PROFILES_ACTIVE: "kubernetes"
  LOG_LEVEL: "INFO"
  CACHE_TTL_MINUTES: "15"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: jira-platform
  labels:
    app: jira-gateway
    component: config
data:
  GATEWAY_PORT: "80"
  GATEWAY_HTTPS_PORT: "443"
  ISSUE_SERVICE_URL: "http://jira-issue-service.jira-platform.svc.cluster.local:8084"
  PROJECT_SERVICE_URL: "http://jira-project-service.jira-platform.svc.cluster.local:8083"
  WORKFLOW_SERVICE_URL: "http://jira-workflow-service.jira-platform.svc.cluster.local:8085"
  ADMIN_SERVICE_URL: "http://jira-admin-service.jira-platform.svc.cluster.local:8082"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "1000"
  RATE_LIMIT_CONNECTIONS_PER_HOST: "100"
  TIMEOUT_READ: "30000"
  TIMEOUT_WRITE: "30000"