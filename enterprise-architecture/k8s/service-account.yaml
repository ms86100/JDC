apiVersion: v1
kind: ServiceAccount
metadata:
  name: jira-platform-sa
  namespace: jira-platform
  labels:
    app: jira-platform
    component: service-account
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jira-platform-role
  namespace: jira-platform
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jira-platform-role-binding
  namespace: jira-platform
subjects:
  - kind: ServiceAccount
    name: jira-platform-sa
    namespace: jira-platform
roleRef:
  kind: Role
  name: jira-platform-role
  apiGroup: rbac.authorization.k8s.io