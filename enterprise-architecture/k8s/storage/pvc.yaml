apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jira-platform-logs-pvc
  namespace: jira-platform
  labels:
    app: jira-platform
    component: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jira-platform-backup-pvc
  namespace: jira-platform
  labels:
    app: jira-platform
    component: backup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard