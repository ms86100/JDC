  namespace: avionics-systems-platform
  labels:
    app: avionics-systems-gateway
    version: v1
    component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: avionics-systems-gateway
  template:
    metadata:
      labels:
        app: avionics-systems-gateway
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: avionics-systems-platform-sa
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: avionics-systems-gateway
          image: avionics-systems-platform/avionics-systems-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            - name: ISSUE_SERVICE_URL
              value: "http://avionics-systems-issue-service.avionics-systems-platform.svc.cluster.local:8084"
            - name: PROJECT_SERVICE_URL
              value: "http://avionics-systems-project-service.avionics-systems-platform.svc.cluster.local:8083"
            - name: WORKFLOW_SERVICE_URL
              value: "http://avionics-systems-workflow-service.avionics-systems-platform.svc.cluster.local:8085"
            - name: ADMIN_SERVICE_URL
              value: "http://avionics-systems-admin-service.avionics-systems-platform.svc.cluster.local:8082"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - avionics-systems-gateway
                topologyKey: kubernetes.io/hostname
---
