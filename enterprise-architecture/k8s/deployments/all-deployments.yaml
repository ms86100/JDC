apiVersion: apps/v1
kind: Deployment
metadata:
  name: avionics-systems-project-service
  namespace: avionics-systems-platform
  labels:
    app: avionics-systems-project-service
    version: v1
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: avionics-systems-project-service
  template:
    metadata:
      labels:
        app: avionics-systems-project-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: avionics-systems-platform-sa
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: avionics-systems-project-service
          image: avionics-systems-platform/avionics-systems-project-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            - name: JAVA_OPTS
              value: "-Xmx256m -Xms128m -XX:+UseG1GC"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: avionics-systems-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: avionics-systems-config
                  key: DB_PORT
            - name: EUREKA_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: avionics-systems-config
                  key: EUREKA_SERVER_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 5
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - avionics-systems-project-service
                topologyKey: kubernetes.io/hostname
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: avionics-systems-project-service-hpa
  namespace: avionics-systems-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: avionics-systems-project-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
