apiVersion: apps/v1
kind: Deployment
metadata:
  name: jira-project-service
  namespace: jira-platform
  labels:
    app: jira-project-service
    version: v1
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jira-project-service
  template:
    metadata:
      labels:
        app: jira-project-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: jira-platform-sa
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: jira-project-service
          image: jira-platform/jira-project-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            - name: JAVA_OPTS
              value: "-Xmx256m -Xms128m -XX:+UseG1GC"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: jira-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: jira-config
                  key: DB_PORT
            - name: EUREKA_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: jira-config
                  key: EUREKA_SERVER_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 5
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - jira-project-service
                topologyKey: kubernetes.io/hostname
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jira-project-service-hpa
  namespace: jira-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jira-project-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
