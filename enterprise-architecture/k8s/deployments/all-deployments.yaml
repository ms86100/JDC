apiVersion: apps/v1
kind: Deployment
metadata:
  name: jira-gateway
  namespace: jira-platform
  labels:
    app: jira-gateway
    version: v1
    component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jira-gateway
  template:
    metadata:
      labels:
        app: jira-gateway
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: jira-platform-sa
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: jira-gateway
          image: jira-platform/jira-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            - name: ISSUE_SERVICE_URL
              value: "http://jira-issue-service.jira-platform.svc.cluster.local:8084"
            - name: PROJECT_SERVICE_URL
              value: "http://jira-project-service.jira-platform.svc.cluster.local:8083"
            - name: WORKFLOW_SERVICE_URL
              value: "http://jira-workflow-service.jira-platform.svc.cluster.local:8085"
            - name: ADMIN_SERVICE_URL
              value: "http://jira-admin-service.jira-platform.svc.cluster.local:8082"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - jira-gateway
                topologyKey: kubernetes.io/hostname
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jira-gateway-hpa
  namespace: jira-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jira-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80