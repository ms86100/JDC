  replicas: 1
  selector:
    matchLabels:
      app: avionics-systems-zookeeper
  template:
    metadata:
      labels:
        app: avionics-systems-zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.6.0
          ports:
            - containerPort: 2181
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
---
# =============================================================================
# Kafka (Infrastructure)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: avionics-systems-kafka
  namespace: avionics-systems-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: avionics-systems-kafka
  template:
    metadata:
      labels:
        app: avionics-systems-kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.0
          ports:
            - containerPort: 9092
            - containerPort: 29092
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "avionics-systems-zookeeper:2181"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://avionics-systems-kafka:29092"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
