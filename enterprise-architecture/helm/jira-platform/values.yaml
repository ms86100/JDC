# Default values for Jira Platform

global:
  imageRegistry: docker.io
  imagePullSecrets: []
  storageClass: ""

# Service configurations
services:
  issue-service:
    enabled: true
    replicaCount: 2
    image:
      repository: jira-platform/jira-issue-service
      tag: "1.0.0"
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      ports:
        http: 8084
        grpc: 9090
    ingress:
      enabled: true
      className: "nginx"
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
        nginx.ingress.kubernetes.io/proxy-body-size: "50m"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      hosts:
        - host: api.platform.local
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: jira-api-tls
          hosts:
            - api.platform.local
    resources:
      enabled: true
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
    persistence:
      enabled: false
    livenessProbe:
      enabled: true
      initialDelaySeconds: 60
      periodSeconds: 10
    readinessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 5
    env:
      SPRING_PROFILES_ACTIVE: kubernetes
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseG1GC"
      DB_SCHEMA: jira_issue
    configmap:
      extraVars:
        REDIS_HOST: "jira-redis"
        KAFKA_BOOTSTRAP_SERVERS: "jira-kafka:9092"
        EUREKA_SERVER_URL: "http://jira-eureka:8761/eureka"
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8084"

  project-service:
    enabled: true
    replicaCount: 1
    image:
      repository: jira-platform/jira-project-service
      tag: "1.0.0"
    service:
      type: ClusterIP
      ports:
        http: 8083
    resources:
      enabled: true
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi

  workflow-service:
    enabled: true
    replicaCount: 2
    image:
      repository: jira-platform/jira-workflow-service
      tag: "1.0.0"
    service:
      type: ClusterIP
      ports:
        http: 8085
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    resources:
      enabled: true
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi

  project-service:
    enabled: true
    replicaCount: 2
    image:
      repository: jira-platform/jira-project-service
      tag: "1.0.0"
    service:
      type: ClusterIP
      ports:
        http: 8083
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    resources:
      enabled: true
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi

  admin-service:
    enabled: true
    replicaCount: 1
    image:
      repository: jira-platform/jira-admin-service
      tag: "1.0.0"
    service:
      type: ClusterIP
      ports:
        http: 8082
    resources:
      enabled: true
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi

  admin-service:
    enabled: true
    replicaCount: 1
    image:
      repository: jira-platform/jira-admin-service
      tag: "1.0.0"
    service:
      type: ClusterIP
      ports:
        http: 8082

  gateway:
    enabled: true
    replicaCount: 2
    image:
      repository: jira-platform/jira-gateway
      tag: "1.0.0"
    service:
      type: LoadBalancer
      ports:
        http: 80
        https: 443
    ingress:
      enabled: true
      className: "nginx"
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
      hosts:
        - host: platform.local
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: jira-tls
          hosts:
            - platform.local

# External Database Configuration
postgresql:
  enabled: true
  auth:
    database: jira_platform
    username: jiraadmin
    password: "" # Use secret in production
  primary:
    persistence:
      size: 50Gi
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# Redis Cache Configuration
redis:
  enabled: true
  auth:
    password: "" # Use secret in production
  master:
    persistence:
      size: 5Gi
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
  replica:
    replicaCount: 2
    persistence:
      size: 5Gi

# Kafka Configuration
kafka:
  enabled: true
  replicaCount: 3
  kraft:
    enabled: true
  persistence:
    size: 20Gi
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  topics:
    - name: test-events.test-created
      partitions: 3
      replicationFactor: 3
    - name: test-events.execution-completed
      partitions: 3
      replicationFactor: 3
    - name: test-events.cicd-result
      partitions: 5
      replicationFactor: 3

# Monitoring Stack
prometheus:
  enabled: true
  alertmanager:
    enabled: true
  server:
    retention: 15d
    persistentVolume:
      size: 50Gi

grafana:
  enabled: true
  adminPassword: "" # Use secret in production
  persistence:
    enabled: true
    size: 10Gi

# Ingress Controller
ingress-nginx:
  enabled: true
  controller:
    replicaCount: 2
    service:
      type: LoadBalancer
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

# Certificate Manager
cert-manager:
  enabled: true
  installCRDs: true
  starter:
    enabled: true

# Service Account Configuration
serviceAccount:
  create: true
  name: jira-platform-sa
  annotations:
    eks.amazonaws.com/role-arn: ""

# Security Context
securityContext:
  enabled: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Network Policies
networkPolicies:
  enabled: false
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: jira-platform
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 9092

# Pod Annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8084"

# Extra configuration
extraConfig:
  enabled: true
  data:
    log-level: INFO
    cache-ttl-minutes: "15"
    max-connections: "100"

# Init Containers
initContainers:
  enabled: false
  image:
    repository: busybox
    tag: "latest"

# Sidecar Containers
sidecars:
  enabled: false
  containers: []

# Node Configuration
nodeSelector:
  workload-type: general-purpose

tolerations:
  - key: "node-type"
    operator: "Equal"
    value: "general-purpose"
    effect: "NoSchedule"

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: Exists
          topologyKey: kubernetes.io/hostname