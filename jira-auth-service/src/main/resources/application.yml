spring:
  application:
    name: jira-auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jira_platform}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 20000
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: jira_auth
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 500
        generate_statistics: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    default-schema: jira_auth
    schemas: jira_auth
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8081
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
  tomcat:
    threads:
      max: 200
      min-spare: 20
    max-connections: 8192
    accept-count: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

logging:
  level:
    com.jira.auth: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
  file:
    path: ${LOG_PATH:../../logs}/auth

cluster:
  oauth2:
    enabled: ${OAUTH2_ENABLED:false}
    trusted-issuers:
      - ${OAUTH2_ISSUER_URI:}
    jwk-set-uri: ${OAUTH2_JWK_SET_URI:}
    local-auth-fallback: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# ---------------------------------------------------------------------------
# Application-level configurable defaults (previously hardcoded)
# ---------------------------------------------------------------------------
app:
  defaults:
    role-admin: ROLE_ADMIN
    role-user: ROLE_USER
    token-type: Bearer
    refresh-token-type: refresh
    auth-provider-local: LOCAL
    auth-provider-saml: SAML
    saml-email-domain: "@saml.local"
    default-registration-id: default
    role-description-prefix: "System "
  admin:
    username: ${ADMIN_USERNAME:ms86100}
    email: ${ADMIN_EMAIL:admin@test.local}
  security:
    max-failed-login-attempts: ${MAX_FAILED_LOGIN_ATTEMPTS:5}
    lockout-duration-minutes: ${LOCKOUT_DURATION_MINUTES:15}
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
    suspicious-activity-threshold: ${SUSPICIOUS_ACTIVITY_THRESHOLD:3}
  saml:
    sp-entity-id: ${SAML_SP_ENTITY_ID:jira-platform-sp}
    error-redirect: ${SAML_ERROR_REDIRECT:/auth/login?error=saml_failed}
  openapi:
    title: ${OPENAPI_TITLE:Jira Auth Service API}
    version: ${OPENAPI_VERSION:1.0.0}
    description: ${OPENAPI_DESCRIPTION:Microservice for user authentication, registration, and JWT token management}
    contact-name: ${OPENAPI_CONTACT:Jira Platform Team}
    license-name: ${OPENAPI_LICENSE:Apache 2.0}
    license-url: ${OPENAPI_LICENSE_URL:https://www.apache.org/licenses/LICENSE-2.0}
